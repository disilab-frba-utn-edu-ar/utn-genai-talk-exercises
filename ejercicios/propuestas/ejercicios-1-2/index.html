<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ejercicios 1 y 2 por etapas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: la consigna en tres etapas que se abren en orden (contexto técnico → contexto del ejercicio →
   qué hacer) y, al costado, las preguntas siempre a mano. Estética del visor: papel, tinta, sombra dura. */
:root {
  --fondo: #fbf6ea;
  --superficie: #fffdf7;
  --texto: #17140f;
  --texto-suave: #4f4a42;
  --linea: #17140f;
  --linea-suave: color-mix(in srgb, #17140f 16%, transparent);
  --trama: color-mix(in srgb, #17140f 13%, transparent);
  --acento: #e8482b;
  --acento-texto: #c2361b;
  --acento-suave: color-mix(in srgb, #e8482b 12%, transparent);
  --resaltador: #ffd84d;
  --cielo: #9fd8ff;
  --menta: #a6e8c9;
  --rosa: #ffb3c7;
  --tinta-fija: #17140f;
  --terminal: #17140f;
  --ok: #1f8a5b;
  --radio: 16px;
  --radio-chico: 10px;
  --borde: 2.5px solid var(--linea);
  --sombra: 5px 5px 0 var(--linea);
  --sombra-chica: 3px 3px 0 var(--linea);
  --fuente: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fuente-titulos: "Bricolage Grotesque", var(--fuente);
  --fuente-mano: "Caveat", "Segoe Print", cursive;
  --fuente-codigo: "IBM Plex Mono", ui-monospace, monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #1a1713; --superficie: #24201a; --texto: #f3ecdc; --texto-suave: #c4bba8;
    --linea: #f3ecdc; --linea-suave: color-mix(in srgb, #f3ecdc 18%, transparent);
    --trama: color-mix(in srgb, #f3ecdc 9%, transparent);
    --acento: #ff6a4d; --acento-texto: #ff8a70; --acento-suave: color-mix(in srgb, #ff6a4d 16%, transparent);
    --terminal: #0f0d0a; --ok: #5fd39c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #1a1713; --superficie: #24201a; --texto: #f3ecdc; --texto-suave: #c4bba8;
  --linea: #f3ecdc; --linea-suave: color-mix(in srgb, #f3ecdc 18%, transparent);
  --trama: color-mix(in srgb, #f3ecdc 9%, transparent);
  --acento: #ff6a4d; --acento-texto: #ff8a70; --acento-suave: color-mix(in srgb, #ff6a4d 16%, transparent);
  --terminal: #0f0d0a; --ok: #5fd39c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--fondo);
  background-image: radial-gradient(var(--trama) 1.2px, transparent 1.4px);
  background-size: 18px 18px;
  color: var(--texto);
  font-family: var(--fuente);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--fuente-titulos); font-weight: 800; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); }
h2 { font-size: clamp(1.35rem, 3vw, 1.75rem); }
h3 { font-size: 1.1rem; }
p { margin: 0; }
code { font-family: var(--fuente-codigo); font-size: 0.88em; background: var(--acento-suave); padding: 0 0.25rem; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
.suave { color: var(--texto-suave); }
.sobretitulo { font-family: var(--fuente-codigo); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acento-texto); }
.mano { font-family: var(--fuente-mano); font-size: 1.4rem; line-height: 1.1; color: var(--acento-texto); }

.pagina {
  max-width: 82rem; margin: 0 auto;
  padding-block: 1.75rem 6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 1.5rem;
}

/* ── Cabecera y selector ─────────────────── */
.cabecera { display: grid; gap: 0.6rem; max-width: 56rem; }
.segmentado { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.segmentado button {
  border: var(--borde); border-radius: 999px; background: var(--superficie);
  padding: 0.3rem 0.85rem; font-weight: 600; font-size: 0.9rem;
}
.segmentado button[aria-pressed="true"] { background: var(--texto); color: var(--fondo); }

.titulo-ejercicio { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.5rem 1rem; }
.reloj { font-family: var(--fuente-codigo); font-weight: 700; border: var(--borde); border-radius: 999px; padding: 0.15rem 0.7rem; background: var(--superficie); font-variant-numeric: tabular-nums; }

/* ── Disposición: etapas + panel de preguntas ── */
.visor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 22rem); gap: 1.75rem; align-items: start; }
.visor.preguntas-en-grande { grid-template-columns: minmax(0, 1fr); }

/* Hilo de etapas */
.hilo { list-style: none; margin: 0; padding: 0; display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.25rem; }
.hilo li { flex: 1 0 8.5rem; }
.hilo button {
  width: 100%; text-align: left; border: none; background: none; padding: 0.2rem 0.1rem; display: grid; gap: 0.3rem;
}
.hilo button:disabled { cursor: not-allowed; }
.hilo .barra { height: 7px; border-radius: 999px; background: var(--linea-suave); }
.hilo .hecha .barra { background: var(--texto); }
.hilo .actual .barra { background: var(--acento); }
.hilo .siempre .barra { background: repeating-linear-gradient(90deg, var(--cielo) 0 10px, transparent 10px 14px); border: 1.5px solid var(--linea); height: 9px; }
.hilo .nombre { font-size: 0.82rem; font-weight: 600; color: var(--texto-suave); line-height: 1.25; display: flex; gap: 0.3rem; align-items: baseline; }
.hilo .actual .nombre, .hilo .hecha .nombre, .hilo .siempre .nombre { color: var(--texto); }

.etapas { display: grid; gap: 0.8rem; min-width: 0; }

/* Etapa abierta */
.etapa {
  background: var(--superficie); border: var(--borde); border-radius: var(--radio); box-shadow: var(--sombra);
  padding: clamp(1rem, 3vw, 1.6rem); display: grid; gap: 1.1rem; min-width: 0;
  animation: entrar 0.35s var(--ease);
}
@keyframes entrar { from { opacity: 0; transform: translateY(8px); } }
.etapa-cabecera { display: grid; gap: 0.3rem; }
.etapa .bajada { font-size: 1.02rem; max-width: 62ch; }
.bloque { display: grid; gap: 0.55rem; min-width: 0; }
.bloque + .bloque { padding-top: 1rem; border-top: 1.5px dashed var(--linea-suave); }
.bloque ol, .bloque ul { margin: 0; padding-left: 1.3rem; display: grid; gap: 0.35rem; }
.siguiente-fila { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem; padding-top: 0.4rem; }
.boton {
  border: var(--borde); border-radius: 999px; background: var(--superficie); padding: 0.5rem 1.15rem; font-weight: 700;
  box-shadow: var(--sombra-chica); transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.boton:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--linea); }
.boton.primario { background: var(--acento); color: #17140f; }

/* Etapas plegadas: hechas y bloqueadas */
.plegada {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.8rem; align-items: center;
  border: 2px solid var(--linea); border-radius: var(--radio-chico); padding: 0.6rem 0.9rem; background: var(--superficie);
}
.plegada .icono { width: 1.9rem; height: 1.9rem; border-radius: 50%; display: grid; place-items: center; font-weight: 800; border: 2px solid var(--linea); }
.plegada.hecha .icono { background: var(--menta); color: var(--tinta-fija); }
.plegada.bloqueada { border-style: dashed; background: transparent; color: var(--texto-suave); }
.plegada.bloqueada .icono { border-style: dashed; }
.plegada .t { font-weight: 700; color: var(--texto); }
.plegada.bloqueada .t { color: var(--texto-suave); }
.plegada .r { font-size: 0.86rem; color: var(--texto-suave); }
.enlace { border: none; background: none; font-weight: 700; color: var(--acento-texto); text-decoration: underline; text-underline-offset: 3px; padding: 0; white-space: nowrap; }

/* Piezas de contenido */
.cmd { display: grid; gap: 0.1rem; background: var(--terminal); color: #f3ecdc; border-radius: 8px; padding: 0.5rem 0.7rem; min-width: 0; }
.cmd pre { margin: 0; font-family: var(--fuente-codigo); font-size: 0.82rem; white-space: pre; overflow-x: auto; }
.cmd .comentario { color: #f3ecdc88; }
.copiar { justify-self: end; order: -1; border: 1px solid #f3ecdc55; background: transparent; color: #f3ecdc; border-radius: 4px; font-size: 0.7rem; padding: 0.05rem 0.4rem; font-family: var(--fuente-codigo); }
.prompt { border: var(--borde); border-radius: var(--radio-chico); background: color-mix(in srgb, var(--resaltador) 22%, var(--superficie)); padding: 0.8rem 0.9rem; display: grid; gap: 0.5rem; }
.prompt pre { margin: 0; font-family: var(--fuente-codigo); font-size: 0.8rem; white-space: pre-wrap; max-height: 14rem; overflow-y: auto; }
.prompt .copiar { color: var(--texto); border-color: var(--linea); }
.ciclo { margin: 0; font-family: var(--fuente-codigo); font-size: 0.78rem; line-height: 1.45; background: var(--superficie); border: 2px solid var(--linea); border-radius: var(--radio-chico); padding: 0.7rem; overflow-x: auto; white-space: pre; }
.regla { border-left: 5px solid var(--acento); padding: 0.4rem 0.8rem; background: var(--acento-suave); border-radius: 0 8px 8px 0; font-weight: 600; }
.aviso { font-size: 0.88rem; color: var(--texto-suave); display: flex; gap: 0.4rem; }
.aviso::before { content: "↳"; color: var(--acento); font-weight: 700; }
.criterios { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.criterios span { border: 2px solid var(--linea); border-radius: 999px; padding: 0 0.55rem; font-size: 0.82rem; font-weight: 600; }
.pestanas { display: grid; gap: 0.6rem; }
.pestanas .contenido { border: 2px solid var(--linea); border-radius: var(--radio-chico); padding: 0.8rem 0.9rem; display: grid; gap: 0.5rem; }

/* Panel "Probar la API" (maqueta) */
.api { border: var(--borde); border-radius: var(--radio-chico); padding: 0.8rem; display: grid; gap: 0.6rem; background: color-mix(in srgb, var(--cielo) 14%, var(--superficie)); }
.api-fila { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.5rem; align-items: center; }
.metodo { font-family: var(--fuente-codigo); font-weight: 700; font-size: 0.78rem; border: 2px solid var(--linea); border-radius: 6px; padding: 0 0.35rem; }
.ruta { font-family: var(--fuente-codigo); font-size: 0.8rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini { border: 2px solid var(--linea); border-radius: 999px; background: var(--superficie); font-size: 0.8rem; font-weight: 700; padding: 0.1rem 0.7rem; }
.respuesta { font-family: var(--fuente-codigo); font-size: 0.78rem; grid-column: 1 / -1; display: flex; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; }
.estado { font-weight: 700; border: 2px solid currentColor; border-radius: 6px; padding: 0 0.35rem; }
.estado.mal { color: var(--acento-texto); } .estado.bien { color: var(--ok); }
.gantt { display: grid; gap: 0.3rem; }
.pista { position: relative; height: 1.5rem; }
.pista span { position: absolute; top: 0; bottom: 0; border: 2px solid var(--tinta-fija); border-radius: 5px; font-size: 0.7rem; font-weight: 700; color: var(--tinta-fija); padding-inline: 0.3rem; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
.pista .cruce { border: none; background: repeating-linear-gradient(45deg, var(--acento) 0 4px, transparent 4px 8px); opacity: 0.6; }
.eje { position: relative; height: 1rem; font-family: var(--fuente-codigo); font-size: 0.68rem; color: var(--texto-suave); }
.eje span { position: absolute; transform: translateX(-50%); }
.eje span:first-child { transform: none; } .eje span:last-child { transform: translateX(-100%); }
.maqueta { font-size: 0.72rem; color: var(--texto-suave); font-style: italic; }

/* ── Panel de preguntas ──────────────────── */
.preguntas {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 1rem);
  max-height: calc(100vh - 2rem); display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--superficie); border: var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); overflow: hidden;
}
.preguntas-cabecera { padding: 0.8rem 1rem 0.6rem; border-bottom: 2px solid var(--linea); background: color-mix(in srgb, var(--cielo) 30%, var(--superficie)); display: grid; gap: 0.35rem; }
.preguntas-cabecera .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
.progreso { height: 8px; border: 1.5px solid var(--linea); border-radius: 999px; overflow: hidden; background: var(--superficie); }
.progreso div { height: 100%; background: var(--menta); transition: width 0.3s var(--ease); }
.lista-preguntas { overflow-y: auto; padding: 0.4rem 0.6rem 0.8rem; display: grid; gap: 0.25rem; align-content: start; }
.parte { font-family: var(--fuente-codigo); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto-suave); padding: 0.6rem 0.4rem 0.1rem; }
.pregunta { border-radius: 8px; }
.pregunta > button {
  width: 100%; border: none; background: none; text-align: left; padding: 0.45rem 0.4rem; border-radius: 8px;
  display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 0.4rem; align-items: baseline;
}
.pregunta > button:hover { background: var(--acento-suave); }
.pregunta .n { font-family: var(--fuente-codigo); font-weight: 700; font-size: 0.85rem; }
.pregunta .titulo { font-weight: 700; font-size: 0.92rem; line-height: 1.3; }
.pregunta .cuando { display: block; font-weight: 400; font-size: 0.75rem; color: var(--texto-suave); }
.pregunta .avance { font-family: var(--fuente-codigo); font-size: 0.72rem; font-weight: 700; border: 2px solid var(--linea); border-radius: 999px; padding: 0 0.4rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pregunta.respondida .avance { background: var(--menta); color: var(--tinta-fija); border-color: var(--tinta-fija); }
.pregunta .detalle { padding: 0.1rem 0.4rem 0.8rem 2.4rem; display: grid; gap: 0.7rem; }
.sub { display: grid; gap: 0.3rem; }
.sub label { font-size: 0.86rem; line-height: 1.35; }
.sub-n { font-family: var(--fuente-codigo); font-size: 0.72rem; font-weight: 700; color: var(--texto-suave); }
.sub.lista textarea { border-color: var(--ok); }
.pregunta textarea {
  width: 100%; min-height: 3.2rem; resize: vertical; border: 2px solid var(--linea); border-radius: 8px; padding: 0.45rem 0.55rem;
  font: inherit; font-size: 0.86rem; background: var(--fondo); color: var(--texto);
}
.opcional { font-size: 0.68rem; font-weight: 700; border: 1.5px dashed var(--linea); border-radius: 999px; padding: 0 0.35rem; margin-left: 0.25rem; vertical-align: 1px; }
.preguntas-pie { padding: 0.6rem 0.8rem; border-top: 2px solid var(--linea); display: flex; gap: 0.5rem; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.preguntas-pie .boton { padding: 0.3rem 0.8rem; font-size: 0.85rem; }

/* Preguntas en grande (cuarta etapa) */
.preguntas-grandes { position: static; max-height: none; }
.preguntas-grandes .lista-preguntas { overflow: visible; padding: 0.5rem 1rem 1rem; }

/* Botón flotante y hoja en celular */
.flotante { display: none; }
.cerrar-hoja { display: none; }
@media (max-width: 900px) {
  .visor { grid-template-columns: minmax(0, 1fr); }
  .visor > .preguntas {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 20; max-height: 78vh;
    border-radius: var(--radio) var(--radio) 0 0; border-bottom: none; box-shadow: 0 -4px 0 var(--linea);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transform: translateY(105%); transition: transform 0.3s var(--ease);
  }
  .visor.hoja-abierta > .preguntas { transform: none; }
  .visor > .preguntas .cerrar-hoja { display: inline-block; }
  .flotante {
    display: inline-flex; position: fixed; z-index: 19; gap: 0.5rem; align-items: center;
    right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    border: var(--borde); border-radius: 999px; background: var(--cielo); color: var(--tinta-fija); padding: 0.55rem 1rem; font-weight: 800; box-shadow: var(--sombra-chica);
  }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<main class="pagina">
  <header class="cabecera">
    <span class="sobretitulo">Propuesta · visor de ejercicios</span>
    <h1>La consigna por etapas</h1>
    <p class="suave">Contexto técnico, contexto del ejercicio y qué tenés que hacer: cada etapa se abre cuando apretás <b>Siguiente</b>. Las preguntas quedan al costado desde el principio.</p>
    <div class="segmentado" id="selector-ejercicio" role="group" aria-label="Ejercicio"></div>
  </header>

  <div class="titulo-ejercicio">
    <h2 id="titulo"></h2>
    <span class="reloj" id="reloj"></span>
  </div>

  <div class="visor" id="visor">
    <section class="etapas" aria-label="Consigna">
      <ol class="hilo" id="hilo" aria-label="Etapas"></ol>
      <div id="etapas" class="etapas"></div>
    </section>
    <aside class="preguntas" id="preguntas" aria-labelledby="titulo-preguntas"></aside>
  </div>
  <button type="button" class="flotante" id="flotante" aria-controls="preguntas"></button>
</main>

<script>
/* ── Contenido ───────────────────────────────────────────────── */
const PROMPT_1 = `Contexto: Mentorías a Voluntad es una app donde personas mentoras donan horas
de asesoramiento y los colectivos (fundaciones, ONGs, asambleas) reservan
sesiones. Es un repo full stack: client/ (Vite + React + TypeScript) y server/
(Express + TypeScript en capas: routes → services → repositories → domain),
con los datos en archivos JSON dentro de data/. La constitution del proyecto
está en .specify/memory/constitution.md y dice, entre otras cosas:
"Una mentora NO PUEDE tener dos sesiones confirmadas que se superpongan".

Problema: el endpoint POST /api/sesiones solo rechaza una sesión nueva si otra
sesión confirmada de la misma mentora, el mismo día, empieza EXACTAMENTE a la
misma hora. Si una mentora tiene una revisión de código de 10:00 a 11:00, hoy
un colectivo puede reservarle otra sesión de 10:30 a 11:15 y quedan
superpuestas.

Lo que necesito:
1. Extraé la detección de superposición a una función pura en server/domain/,
   por ejemplo:
   haySuperposicion(sesiones, { mentoraId, fecha, horaInicio, horaFin }): boolean
   Solo cuentan las sesiones con estado "confirmada" de la misma mentora y de
   la misma fecha. Una sesión que termina 10:30 y otra que empieza 10:30 NO se
   superponen. La función no hace IO.
2. Trabajá con TDD: primero escribí los tests en
   tests/server/domain/superposicion.test.ts y un test de la API en
   tests/server/api/ que espere el 409; corrélos y mostrame que fallan; recién
   después implementá.
3. Usá haySuperposicion en el caso de uso de crear sesión (capa de servicios).
   Si hay superposición, la API responde 409 con
   { "error": "El horario se superpone con otra sesión de la mentora" }.
4. No modifiques los archivos de data/. No toques los tests existentes salvo
   que sea imprescindible; si tenés que hacerlo, avisame cuál y por qué.
5. Al terminar, corré \`npm test\` y \`npm run lint\` y contame el resultado.

Antes de editar código, explicame en 3-4 líneas tu plan.`;

const PROMPT_2_SKILL = `Necesito un endpoint para obtener el detalle de una sesión por su id:
GET /api/sesiones/:id. Si no existe, 404.`;

const PROMPT_2_MCP = `Con el navegador, entrá a http://localhost:5173 y reservá una sesión de
mentoría como si fueras un colectivo: filtrá las mentoras por una habilidad,
elegí una mentora, un tipo de asesoría, un día y un horario, completá los
datos del colectivo (colectivo, proyecto, nombre y email de contacto) y
confirmá. Después verificá con el endpoint GET /api/sesiones/:id que hiciste
antes que la sesión quedó guardada con los datos correctos. Revisá también las
requests de red: ¿alguna respuesta de la API incluye el email de una mentora?
Sacá una captura de la pantalla de confirmación, guardala en
ejercicios/02-skill-y-mcp/captura-confirmacion.png y contame cualquier problema
de usabilidad o accesibilidad que encuentres (por ejemplo, ¿se puede hacer

function leer(clave, defecto) { try { const v = localStorage.getItem(clave); return v === null ? defecto : JSON.parse(v); } catch { return defecto; } }
function guardar(clave, valor) { try { localStorage.setItem(clave, JSON.stringify(valor)); } catch {} }
const PREGUNTAS = 3; // índice de la etapa "Preguntas"

  ej: '1',

};
Object.assign(estado.porEj, leer('etapas-progreso', {}));
const prog = () => estado.porEj[estado.ej];

/* ── Piezas ──────────────────────────────────────────────────── */
function pestanasAgente(contenidos) {
  const nombres = { claude: 'Claude Code', codex: 'Codex CLI', cline: 'Cline' };
  return `<div class="pestanas"><div class="segmentado" role="group" aria-label="Agente">${Object.keys(contenidos).map((k) => `<button type="button" data-agente="${k}" aria-pressed="${k === estado.agente}">${nombres[k]}</button>`).join('')}</div>
    <div class="contenido">${contenidos[estado.agente]}</div></div>`;
}

const RESERVAS = [
  { titulo: 'Estrategia de testing a las 19:00', ini: 19 * 60, fin: 19 * 60 + 45 },
  { titulo: 'Revisión de código a las 19:30', ini: 19 * 60 + 30, fin: 20 * 60 },
];
const DESDE = 18 * 60 + 30, HASTA = 20 * 60 + 30;
const pct = (m) => ((m - DESDE) / (HASTA - DESDE)) * 100;
const hora = (m) => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;

function panelSuperposicion(momento) {
  const filas = RESERVAS.map((r, i) => {
    const clave = `${momento}-${i}`;
    const st = i === 0 || momento === 'antes' ? 201 : 409;
    const cuerpo = st === 409 ? '{ "error": "El horario se superpone con otra sesión de la mentora" }' : '{ "id": "…", "estado": "confirmada", … }';
    const clase = st === 409 ? 'bien' : i === 1 ? 'mal' : '';
    return `<div class="api-fila"><span class="metodo">POST</span><span class="ruta">/api/sesiones · ${esc(r.titulo)}</span><button type="button" class="mini" data-api="${clave}">${estado.api[clave] ? 'Reenviar' : 'Enviar'}</button>
      ${estado.api[clave] ? `<div class="respuesta"><span class="estado ${clase}">${st}</span><span>${esc(cuerpo)}</span></div>` : ''}</div>`;
  }).join('');
  const ambas = estado.api[`${momento}-0`] && estado.api[`${momento}-1`];
  const nota = !ambas ? '' : momento === 'antes'
    ? '<p class="mano">Las dos dieron 201: la API deja superponer turnos. Ese es el bug.</p>'
    : '<p class="mano">La segunda da 409: el agente lo arregló.</p>';
  return `<div class="api">
    <div class="gantt" role="img" aria-label="Llamada 1 de 19:00 a 19:45, llamada 2 de 19:30 a 20:00: se pisan de 19:30 a 19:45">
      ${RESERVAS.map((r, i) => `<div class="pista"><span style="left:${pct(r.ini)}%;width:${pct(r.fin) - pct(r.ini)}%;background:${i ? 'var(--rosa)' : 'var(--cielo)'}">${hora(r.ini)}–${hora(r.fin)}</span>${i ? `<span class="cruce" style="left:${pct(RESERVAS[1].ini)}%;width:${pct(RESERVAS[0].fin) - pct(RESERVAS[1].ini)}%"></span>` : ''}</div>`).join('')}
      <div class="eje">${[0, 1, 2, 3, 4].map((k) => `<span style="left:${k * 25}%">${hora(DESDE + k * 30)}</span>`).join('')}</div>
    </div>
    ${filas}${nota}
    <span class="maqueta">Maqueta: en el visor es el panel "Probar la API" que ya existe.</span>
  </div>`;
}

function panelSesion() {
  const filas = [
    ['existe', '/api/sesiones/3f9c…', 200, '{ "id": "3f9c…", "mentoraId": "…", "proyecto": "…", "fecha": "…", "horaInicio": "18:00", "estado": "confirmada" }'],
    ['no-existe', '/api/sesiones/no-existe', 404, '{ "error": "…" }'],
  ];
  return `<div class="api">${filas.map(([k, ruta, st, cuerpo]) => `<div class="api-fila"><span class="metodo">GET</span><span class="ruta">${ruta}</span><button type="button" class="mini" data-api="sesion-${k}">Enviar</button>
    ${estado.api[`sesion-${k}`] ? `<div class="respuesta"><span class="estado ${st === 200 ? 'bien' : ''}">${st}</span><span>${esc(cuerpo)}</span></div>` : ''}</div>`).join('')}
    <span class="maqueta">Maqueta del panel "Consultar sesiones". Fijate que no venga contactoEmail.</span></div>`;
}

/* ── Etapas ──────────────────────────────────────────────────── */
function renderHilo(ej) {
  const p = prog();
  const items = ej.etapas.map((e, i) => {
    const bloqueada = i > p.alcanzada;
    const clase = i === p.actual ? 'actual' : bloqueada ? '' : 'hecha';
    const marca = bloqueada ? '🔒' : i === p.actual ? '' : '✓';
    return `<li class="${clase}"><button type="button" data-etapa="${i}" ${bloqueada ? 'disabled' : ''} ${i === p.actual ? 'aria-current="step"' : ''}><span class="barra"></span><span class="nombre">${marca} ${i + 1}. ${e.nombre}</span></button></li>`;
  });
  items.push(`<li class="siempre ${p.actual === PREGUNTAS ? 'actual' : ''}"><button type="button" data-etapa="${PREGUNTAS}"><span class="barra"></span><span class="nombre">✎ Preguntas · siempre abiertas</span></button></li>`);
  document.getElementById('hilo').innerHTML = items.join('');
}

function renderEtapas(ej) {
  const p = prog();

  if (p.actual === PREGUNTAS) {
    cont.innerHTML = `<div class="preguntas preguntas-grandes">${panelPreguntas(ej, true)}</div>`;
    return;
  }
  cont.innerHTML = ej.etapas.map((e, i) => {
    if (i === p.actual) {
      const sig = i === ej.etapas.length - 1 ? 'Ir a las preguntas' : `Siguiente: ${ej.etapas[i + 1].nombre}`;
      return `<article class="etapa" aria-labelledby="etapa-${i}">
        <div class="etapa-cabecera"><span class="sobretitulo">Etapa ${i + 1} de ${ej.etapas.length}</span><h2 id="etapa-${i}">${e.nombre}</h2><p class="bajada">${e.bajada}</p></div>
        ${e.bloques()}
        <div class="siguiente-fila">${i > 0 ? `<button type="button" class="enlace" data-etapa="${i - 1}">← ${ej.etapas[i - 1].nombre}</button>` : '<span></span>'}<button type="button" class="boton primario" data-siguiente="${i}">${sig} →</button></div>
      </article>`;
    }
    if (i <= p.alcanzada) {
      return `<div class="plegada hecha"><span class="icono">✓</span><div><div class="t">${i + 1}. ${e.nombre}</div><div class="r">${e.resumen}</div></div><button type="button" class="enlace" data-etapa="${i}">Ver de nuevo</button></div>`;
    }
    return `<div class="plegada bloqueada"><span class="icono">🔒</span><div><div class="t">${i + 1}. ${e.nombre}</div><div class="r">Se abre cuando termines «${ej.etapas[i - 1].nombre}».</div></div><span></span></div>`;
  }).join('');
}

/* ── Preguntas ───────────────────────────────────────────────── */
function contar(ej) {
  const r = prog().respuestas;
  let n = 0, total = 0, hechas = 0;
  ej.partes.forEach((pt) => pt.preguntas.forEach((q) => {
    n++;
    if (q.opcional) return;
    q.subs.forEach((_, j) => { total++; if ((r[`${n}.${j}`] || '').trim()) hechas++; });
  }));
  return { total, hechas };
}

function panelPreguntas(ej, grande) {
  const p = prog();
  const { total, hechas } = contar(ej);
  let n = 0;
  const lista = ej.partes.map((pt) => `<div class="parte">${esc(pt.nombre)}</div>` + pt.preguntas.map((q) => {
    n++;
    const listas = q.subs.filter((_, j) => (p.respuestas[`${n}.${j}`] || '').trim()).length;
    const completa = listas === q.subs.length;
    const abierta = grande || p.abierta === n;
    const cuando = q.cuando === 0 ? 'Se puede pensar desde el principio' : `Con lo de «${ej.etapas[q.cuando].nombre}»`;
    const subs = q.subs.map((texto, j) => {
      const id = `resp-${estado.ej}-${n}-${j}`;
      const valor = p.respuestas[`${n}.${j}`] || '';
      return `<div class="sub ${valor.trim() ? 'lista' : ''}"><label for="${id}"><span class="sub-n">${n}.${j + 1}</span> ${esc(texto)}</label><textarea id="${id}" data-respuesta="${n}.${j}" placeholder="Con evidencia del log">${esc(valor)}</textarea></div>`;
    }).join('');
    return `<div class="pregunta ${completa ? 'respondida' : ''}" data-n="${n}" data-subs="${q.subs.length}">
      <button type="button" data-pregunta="${n}" aria-expanded="${abierta}"><span class="n">${n}.</span><span class="titulo">${esc(q.titulo)}${q.opcional ? '<span class="opcional">opcional</span>' : ''}<span class="cuando">${cuando}</span></span><span class="avance">${listas}/${q.subs.length}</span></button>
      ${abierta ? `<div class="detalle">${subs}</div>` : ''}
    </div>`;
  }).join('')).join('');
  return `<div class="preguntas-cabecera">
      <div class="fila"><h3 id="titulo-preguntas">Preguntas</h3><span class="suave contador" style="font-size:.85rem">${hechas} de ${total} respondidas</span></div>
      <div class="progreso"><div style="width:${(hechas / total) * 100}%"></div></div>
    </div>
    <div class="lista-preguntas">${lista}</div>
    <div class="preguntas-pie">
      ${grande ? `<button type="button" class="enlace" data-etapa="${p.alcanzada}">← Volver a la consigna</button>` : `<button type="button" class="enlace" data-etapa="${PREGUNTAS}">Ver en grande</button>`}
      <button type="button" class="boton cerrar-hoja" data-hoja="0">Cerrar</button>
      <button type="button" class="boton" data-guardar>Guardar respuestas</button>
    </div>`;
}

/* ── Render ──────────────────────────────────────────────────── */
function render() {
  const ej = EJERCICIOS[estado.ej];
  const p = prog();
  document.getElementById('selector-ejercicio').innerHTML = Object.keys(EJERCICIOS).map((k) => `<button type="button" data-ej="${k}" aria-pressed="${k === estado.ej}">Ejercicio ${k}</button>`).join('');
  document.getElementById('titulo').textContent = ej.titulo;
  document.getElementById('reloj').textContent = `${ej.minutos}:00`;
  renderHilo(ej);
  renderEtapas(ej);
  const grande = p.actual === PREGUNTAS;
  const visor = document.getElementById('visor');
  visor.classList.toggle('preguntas-en-grande', grande);
  visor.classList.toggle('hoja-abierta', estado.hoja && !grande);
  const panel = document.getElementById('preguntas');
  panel.hidden = grande;
  if (!grande) panel.innerHTML = panelPreguntas(ej, false);
  const { total, hechas } = contar(ej);
  const flot = document.getElementById('flotante');
  flot.hidden = grande || estado.hoja;
  flot.textContent = `✎ Preguntas · ${hechas}/${total}`;
}

const persistir = () => guardar('etapas-progreso', estado.porEj);

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const p = prog();
  const ej = EJERCICIOS[estado.ej];
  if (b.dataset.ej) { estado.ej = b.dataset.ej; estado.hoja = false; render(); }
  else if (b.dataset.siguiente !== undefined) {
    const i = Number(b.dataset.siguiente);
    const sig = i + 1 >= ej.etapas.length ? PREGUNTAS : i + 1;
    p.alcanzada = Math.max(p.alcanzada, Math.min(sig, ej.etapas.length - 1));
    p.actual = sig; persistir(); render();
    document.getElementById('hilo').scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  else if (b.dataset.etapa !== undefined) { p.actual = Number(b.dataset.etapa); estado.hoja = false; persistir(); render(); }
  else if (b.dataset.agente) { estado.agente = b.dataset.agente; render(); }
  else if (b.dataset.api) { estado.api[b.dataset.api] = true; render(); }
  else if (b.dataset.pregunta) { const n = Number(b.dataset.pregunta); p.abierta = p.abierta === n ? -1 : n; render(); document.getElementById(`resp-${estado.ej}-${n}-0`)?.focus(); }
  else if (b.id === 'flotante') { estado.hoja = true; render(); }
  else if (b.dataset.hoja !== undefined) { estado.hoja = false; render(); }
  else if (b.dataset.guardar !== undefined) { persistir(); b.textContent = 'Guardado'; setTimeout(() => { b.textContent = 'Guardar respuestas'; }, 1500); }
  else if (b.dataset.copiar !== undefined) {
    try { await navigator.clipboard.writeText(b.dataset.copiar); b.textContent = 'copiado'; }
    catch { const pre = b.parentElement.parentElement.querySelector('pre') || b.parentElement.querySelector('pre'); const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'seleccionado'; }
    setTimeout(() => { b.textContent = 'copiar'; }, 1500);
  }
});

// Las respuestas se guardan al escribir; solo se actualizan el tilde y el contador, sin redibujar el textarea.
document.addEventListener('input', (e) => {
  const n = e.target.dataset && e.target.dataset.respuesta;
  if (!n) return;
  prog().respuestas[n] = e.target.value;
  persistir();
  const { total, hechas } = contar(EJERCICIOS[estado.ej]);
  e.target.closest('.sub').classList.toggle('lista', !!e.target.value.trim());
  const fila = e.target.closest('.pregunta');
  const listas = fila.querySelectorAll('.sub.lista').length;
  fila.querySelector('.avance').textContent = `${listas}/${fila.dataset.subs}`;
  fila.classList.toggle('respondida', listas === Number(fila.dataset.subs));
  document.querySelectorAll('.contador').forEach((el) => { el.textContent = `${hechas} de ${total} respondidas`; });
  document.querySelectorAll('.preguntas-cabecera .progreso div').forEach((el) => { el.style.width = `${(hechas / total) * 100}%`; });
  document.getElementById('flotante').textContent = `✎ Preguntas · ${hechas}/${total}`;
});

render();
</script>
</html>
