<script>
const DATOS = {"01-observabilidad-con-hooks":{"titulo":"Observar al agente con hooks","numero":1,"minutos":20,"charla":"\u003cdiv class=\"markdown\">\u003cblockquote>\n\u003cp>\u003cstrong>Charla:\u003c/strong> bloques 1.2.1 \u003cem>Ciclo agéntico\u003c/em> (el modelo pide, el harness\nejecuta), 1.1.3 \u003cem>Herramientas\u003c/em> y 2.1.2 \u003cem>Harness engineering\u003c/em>.\u003c/p>\n\u003c/blockquote>\n\u003c/div>","etapas":[{"nombre":"Contexto técnico","bajada":"Qué es un hook, cómo está configurado tu agente y cómo comprobar que el log graba.","pantallas":[{"titulo":"Qué es un hook","html":"\u003cdiv class=\"markdown\">\u003ch2>Qué es un hook\u003c/h2>\n\u003cp>Un hook es un comando que \u003cstrong>el harness\u003c/strong> (no el modelo) ejecuta\nautomáticamente en momentos fijos del ciclo: cuando arranca la sesión, cuando\nmandás un prompt, antes y después de cada herramienta, cuando el agente\ntermina. Es determinístico: corre siempre, no depende de que el modelo &quot;se\nacuerde&quot;.\u003c/p>\n\u003cfigure class=\"diagrama ciclo\" aria-label=\"Ciclo agéntico: vos mandás un prompt (hook UserPromptSubmit) al modelo; el modelo pide una tool (hook PreToolUse), el harness la ejecuta (hook PostToolUse) y el resultado vuelve al modelo como evidencia. Se repite hasta que el modelo ya no pide tools (hook Stop).\">\n\u003cdiv class=\"ciclo-mapa\" aria-hidden=\"true\">\n\u003cspan class=\"ciclo-bucle\">\u003cspan>↻ ciclo agéntico · se repite mientras el modelo pida tools\u003c/span>\u003c/span>\n\u003cspan class=\"ciclo-actor\" style=\"grid-area:vos\">\u003cspan class=\"ciclo-nombre\">Vos\u003c/span>\u003c/span>\n\u003cspan class=\"ciclo-flecha ciclo-der \" style=\"grid-area:fprompt\">\u003cspan>prompt\u003c/span>\u003c/span>\n\u003cspan class=\"ciclo-hook ciclo-hook-ups\" style=\"grid-area:ups\">\u003cspan class=\"ciclo-tag\">hook\u003c/span>UserPromptSubmit\u003c/span>\n\u003cspan class=\"ciclo-flecha ciclo-der \" style=\"grid-area:fentra\">\u003c/span>\n\u003cspan class=\"ciclo-actor\" style=\"grid-area:modelo\">\u003cspan class=\"ciclo-nombre\">Modelo\u003c/span>\u003cspan class=\"ciclo-detalle\">decide, no ejecuta\u003c/span>\u003c/span>\n\u003cspan class=\"ciclo-flecha ciclo-der \" style=\"grid-area:fpide\">\u003cspan>pide una tool\u003c/span>\u003c/span>\n\u003cspan class=\"ciclo-hook ciclo-hook-pre\" style=\"grid-area:pre\">\u003cspan class=\"ciclo-tag\">hook\u003c/span>PreToolUse\u003c/span>\n\u003cspan class=\"ciclo-flecha ciclo-abajo \" style=\"grid-area:fbaja\">\u003c/span>\n\u003cspan class=\"ciclo-actor\" style=\"grid-area:harness\">\u003cspan class=\"ciclo-nombre\">Harness\u003c/span>\u003cspan class=\"ciclo-detalle\">ejecuta la tool\u003c/span>\u003c/span>\n\u003cspan class=\"ciclo-flecha ciclo-izq \" style=\"grid-area:fizq\">\u003c/span>\n\u003cspan class=\"ciclo-hook ciclo-hook-post\" style=\"grid-area:post\">\u003cspan class=\"ciclo-tag\">hook\u003c/span>PostToolUse\u003c/span>\n\u003cspan class=\"ciclo-flecha ciclo-arriba ciclo-retorno\" style=\"grid-area:fevid\">\u003cspan>\u003cem class=\"ciclo-solo-movil\">↻ vuelve al modelo con el \u003c/em>resultado = evidencia\u003cem class=\"ciclo-solo-movil\">, y se repite mientras pida tools\u003c/em>\u003c/span>\u003c/span>\n\u003cspan class=\"ciclo-flecha ciclo-arriba \" style=\"grid-area:fstop\">\u003cspan>ya no pide más tools\u003c/span>\u003c/span>\n\u003cspan class=\"ciclo-hook ciclo-hook-stop\" style=\"grid-area:stop\">\u003cspan class=\"ciclo-tag\">hook\u003c/span>Stop\u003c/span>\n\u003c/div>\n\u003cfigcaption>\u003cspan>\u003ci class=\"ciclo-muestra-hook\">\u003c/i>hook: lo corre el harness siempre, en ese punto del ciclo\u003c/span>\u003cspan>\u003ci class=\"ciclo-muestra-actor\">\u003c/i>quién actúa\u003c/span>\u003c/figcaption>\n\u003c/figure>\u003c/div>"},{"titulo":"Cómo está configurado cada agente","html":"\u003cdiv class=\"markdown\">\u003cp>Acá todos los hooks llaman al mismo script,\n\u003cspan class=\"enlace-repo\" title=\"../../scripts/agent-logs/log-hook.mjs\">\u003ccode>scripts/agent-logs/log-hook.mjs\u003c/code>\u003c/span>,\nque normaliza el evento y agrega una línea al log de la sesión:\n\u003cstrong>\u003ccode>logs/&lt;agente&gt;/&lt;id-de-sesión&gt;.jsonl\u003c/code>\u003c/strong> (una carpeta por agente y un\narchivo por sesión).\u003c/p>\n\u003ch2>Cómo está configurado cada agente\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Agente\u003c/th>\n\u003cth>Archivo\u003c/th>\n\u003cth>Eventos que se registran\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Claude Code\u003c/td>\n\u003ctd>\u003cspan class=\"enlace-repo\" title=\"../../.claude/settings.json\">\u003ccode>.claude/settings.json\u003c/code>\u003c/span>\u003c/td>\n\u003ctd>SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, PostToolUseFailure, SubagentStop, Stop, SessionEnd\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Codex CLI\u003c/td>\n\u003ctd>\u003cspan class=\"enlace-repo\" title=\"../../.codex/hooks.json\">\u003ccode>.codex/hooks.json\u003c/code>\u003c/span>\u003c/td>\n\u003ctd>SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, SubagentStop, Stop, SessionEnd\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cline (CLI o VS Code)\u003c/td>\n\u003ctd>\u003cspan class=\"enlace-repo\" title=\"../../.clinerules/hooks/\">\u003ccode>.clinerules/hooks/\u003c/code>\u003c/span> (un script por evento)\u003c/td>\n\u003ctd>TaskStart, TaskResume, UserPromptSubmit, PreToolUse, PostToolUse, TaskComplete, TaskCancel\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Abrí el archivo de tu agente y leelo antes de seguir: es corto.\u003c/p>\n\u003c/div>"},{"titulo":"Activá los hooks","html":"\u003cdiv class=\"markdown\">\u003cp>Después, activá los hooks según tu agente:\u003c/p>\n\u003cdetails>\n\u003csummary>\u003cb>Claude Code\u003c/b>\u003c/summary>\u003col>\n\u003cli>Abrí \u003ccode>claude\u003c/code> \u003cstrong>desde la raíz del repo\u003c/strong>.\u003c/li>\n\u003cli>La primera vez te va a pedir que confíes en la carpeta: aceptá.\u003c/li>\n\u003cli>Corré \u003ccode>/hooks\u003c/code> para ver los hooks cargados. Tienen que aparecer los del\nproyecto (ejecutan \u003ccode>node\u003c/code> sobre \u003ccode>scripts/agent-logs/log-hook.mjs\u003c/code>).\u003c/li>\n\u003cli>En Windows tiene que estar instalado Git for Windows (ver la guía de entorno del README).\u003c/li>\n\u003c/ol>\n\u003c/details>\u003cdetails>\n\u003csummary>\u003cb>Codex CLI\u003c/b>\u003c/summary>\u003cp>Codex tiene \u003cstrong>dos controles de confianza\u003c/strong> y los hooks del proyecto no corren\nhasta pasar los dos:\u003c/p>\n\u003col>\n\u003cli>Abrí \u003ccode>codex\u003c/code> \u003cstrong>desde la raíz del repo\u003c/strong> y, cuando pregunte, marcá el\nproyecto como \u003cstrong>confiable\u003c/strong> (trusted). Sin eso, Codex ignora todo lo que hay\nen \u003ccode>.codex/\u003c/code>. Queda registrado en \u003ccode>~/.codex/config.toml\u003c/code> (en Windows,\n\u003ccode>C:\\Users\\&lt;tu-usuario&gt;\\.codex\\config.toml\u003c/code>; en macOS/Linux, \u003ccode>~/.codex/config.toml\u003c/code>, con una ruta como \u003ccode>/ruta/absoluta/a/utn-genai-talk-exercises\u003c/code>):\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode>[projects.'C:\\Users\\&lt;tu-usuario&gt;\\utn-genai-talk-exercises']\ntrust_level = &quot;trusted&quot;\u003c/code>\u003c/pre>\u003c/div>\u003c/li>\n\u003cli>Dentro de Codex corré \u003ccode>/hooks\u003c/code> y \u003cstrong>aprobá cada hook\u003c/strong> del proyecto. Si\ndespués modificás \u003ccode>.codex/hooks.json\u003c/code>, vas a tener que volver a aprobarlos.\u003c/li>\n\u003cli>En Windows los hooks de Codex usan rutas relativas al repo: abrí \u003ccode>codex\u003c/code>\nsiempre \u003cstrong>desde la raíz del repo\u003c/strong>, o los hooks no encuentran el script.\u003c/li>\n\u003cli>Los hooks vienen activados por defecto en versiones recientes. Si tu versión\nes vieja y \u003ccode>/hooks\u003c/code> no existe, actualizá Codex.\u003c/li>\n\u003c/ol>\n\u003c/details>\u003cdetails>\n\u003csummary>\u003cb>Cline (CLI o extensión de VS Code)\u003c/b>\u003c/summary>\u003cp>Abrí el CLI (\u003ccode>cline\u003c/code>) \u003cstrong>desde la raíz del repo\u003c/strong>. Para habilitar los hooks en el CLI, mirá\nla \u003ca href=\"https://docs.cline.bot/cline-cli/installation\" target=\"_blank\" rel=\"noreferrer\">guía del CLI\u003c/a>; si no están disponibles ahí,\nusá la extensión de VS Code con los pasos de abajo:\u003c/p>\n\u003col>\n\u003cli>Abrí la carpeta del repo en VS Code (el repo tiene que ser la raíz del\nworkspace).\u003c/li>\n\u003cli>En Cline: \u003cstrong>Settings → Feature Settings → Enable Hooks\u003c/strong> (en versiones\nrecientes viene activado).\u003c/li>\n\u003cli>En el panel de Cline, abrí la pestaña \u003cstrong>Hooks\u003c/strong> (ícono de balanza abajo) y\nverificá que aparezcan los hooks del workspace y estén encendidos.\u003c/li>\n\u003cli>\u003cstrong>macOS / Linux:\u003c/strong> los scripts sin extensión tienen que ser ejecutables. Si\nno aparecen, corré \u003ccode>chmod +x .clinerules/hooks/*\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Windows:\u003c/strong> Cline usa los archivos \u003ccode>.ps1\u003c/code> de la misma carpeta.\u003c/li>\n\u003c/ol>\n\u003c/details>\n\u003c/div>"},{"titulo":"Verificá que funciona","html":"\u003cdiv class=\"markdown\">\u003ch3>Verificá que funciona\u003c/h3>\n\u003cblockquote>\n\u003cp>Los comandos \u003ccode>npm run logs:*\u003c/code> imprimen líneas largas: corrélos en una terminal\nabierta a pantalla completa (o maximizada). Si la ventana es angosta, las líneas\nquedan cortadas y cuesta leerlas.\u003c/p>\n\u003c/blockquote>\n\u003cp>Mandale al agente un mensaje trivial, por ejemplo \u003cem>&quot;¿qué hay en\npackage.json?&quot;\u003c/em>, y después:\u003c/p>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode>npm run logs:resumen\u003c/code>\u003c/pre>\u003c/div>\u003cp>Tenés que ver una sesión con al menos un \u003ccode>UserPromptSubmit\u003c/code> y una lectura de\narchivo. Si no aparece nada, revisá los hooks de tu agente antes de seguir. Cuando funcione,\nlimpiá el log:\u003c/p>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode>npm run logs:limpiar\u003c/code>\u003c/pre>\u003c/div>\u003cp>Este comando no borra los logs: guarda el actual y arranca uno vacío.\u003c/p>\n\u003c/div>"}]},{"nombre":"Contexto del ejercicio","bajada":"Qué vas a observar, la regla que el agente tiene que respetar y el bug que va a arreglar.","pantallas":[{"titulo":"Objetivo","html":"\u003cdiv class=\"markdown\">\u003ch2>Objetivo\u003c/h2>\n\u003cp>En la charla dijimos que \u003cstrong>el modelo no ejecuta nada\u003c/strong>: pide una herramienta\n(nombre + argumentos) y el \u003cem>harness\u003c/em> la corre y le devuelve el resultado como\nevidencia. En este ejercicio vas a \u003cstrong>ver ese ciclo con tus propios ojos\u003c/strong>: el\nrepo ya tiene configurados \u003cem>hooks\u003c/em> que registran cada paso del agente en un\narchivo de log. Le vas a pasar un pedido concreto y después vas a responder\npreguntas \u003cstrong>usando el log como evidencia\u003c/strong>.\u003c/p>\n\u003c/div>"},{"titulo":"La constitution","html":"\u003cdiv class=\"markdown\">\u003ch2>Antes de empezar\u003c/h2>\n\u003cp>Leé \u003ccode>.specify/memory/constitution.md\u003c/code>: el agente la va a\ntener que respetar y vos la vas a usar para juzgar lo que hizo.\u003c/p>\n\u003c/div>"},{"titulo":"Mirá el bug","html":"\u003cdiv class=\"markdown\">\u003ch3>Antes: mirá el bug con tus propios ojos\u003c/h3>\n\u003cp>Probá crear dos sesiones superpuestas de la misma mentora. La pantalla de reserva\nno te lo va a dejar elegir, pero la API es la que tiene que hacer cumplir la regla:\nprobala directo desde acá, con estas dos llamadas:\u003c/p>\n\u003c/div>\u003caside class=\"anexo-en-linea probar-api\" aria-label=\"Probar la API\">\n\u003cp class=\"pedido-nota\">Las dos van a la misma mentora, el \u003cstrong>2026-11-04\u003c/strong> (el primer día con las 19:00 libre). Mandá la 1 y después la 2.\u003c/p>\n\u003cfigure class=\"gantt\" aria-label=\"Llamada 1 de 19:00 a 19:45, llamada 2 de 19:30 a 20:00: se pisan de 19:30 a 19:45.\">\n\u003cdiv class=\"gantt-fila\" aria-hidden=\"true\">\u003cspan class=\"gantt-etiqueta\">Llamada 1\u003c/span>\u003cdiv class=\"gantt-pista\">\u003cspan class=\"gantt-barra\" style=\"left:25%;width:37.5%\">19:00–19:45\u003c/span>\u003cspan class=\"gantt-cruce\" style=\"left:50%;width:12.5%\">\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"gantt-fila\" aria-hidden=\"true\">\u003cspan class=\"gantt-etiqueta\">Llamada 2\u003c/span>\u003cdiv class=\"gantt-pista\">\u003cspan class=\"gantt-barra\" style=\"left:50%;width:25%\">19:30–20:00\u003c/span>\u003cspan class=\"gantt-cruce\" style=\"left:50%;width:12.5%\">\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"gantt-fila\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cdiv class=\"gantt-pista gantt-eje\">\u003cspan style=\"left:0%\">18:30\u003c/span>\u003cspan style=\"left:25%\">19:00\u003c/span>\u003cspan style=\"left:50%\">19:30\u003c/span>\u003cspan style=\"left:75%\">20:00\u003c/span>\u003cspan style=\"left:100%\">20:30\u003c/span>\u003c/div>\u003c/div>\n\u003c/figure>\n\u003cdiv class=\"pp-pedidos\">\u003cdiv class=\"pedido\">\n\u003cp class=\"pedido-titulo\">Llamada 1: Estrategia de testing (45 min) a las 19:00\u003c/p>\n\u003cdiv class=\"pedido-linea\">\u003cspan class=\"pedido-metodo\">POST\u003c/span>\u003cinput class=\"pedido-ruta\" aria-label=\"Ruta de la llamada 1\" value=\"/api/sesiones\" spellcheck=\"false\">\u003cbutton type=\"button\" class=\"boton\" data-simular='{&quot;estado&quot;:201,&quot;cuerpo&quot;:{&quot;id&quot;:&quot;b1e5…&quot;,&quot;mentoraId&quot;:&quot;8f3c2a1e-…&quot;,&quot;tipoAsesoriaId&quot;:&quot;estrategia_de_testing&quot;,&quot;colectivoId&quot;:&quot;c0e1a2b3-…&quot;,&quot;proyecto&quot;:&quot;Prueba de superposicion&quot;,&quot;contactoNombre&quot;:&quot;Ana&quot;,&quot;contactoEmail&quot;:&quot;ana@example.org&quot;,&quot;fecha&quot;:&quot;2026-11-04&quot;,&quot;horaInicio&quot;:&quot;19:00&quot;,&quot;horaFin&quot;:&quot;19:45&quot;,&quot;estado&quot;:&quot;confirmada&quot;}}'>Enviar\u003c/button>\u003c/div>\n\u003cdetails class=\"pp-body\">\u003csummary class=\"pedido-etiqueta\">Body\u003c/summary>\u003ctextarea class=\"editor-respuestas pedido-cuerpo\" spellcheck=\"false\">{\n  &quot;mentoraId&quot;: &quot;8f3c2a1e-4b5d-4c6e-9f70-1a2b3c4d5e01&quot;,\n  &quot;tipoAsesoriaId&quot;: &quot;estrategia_de_testing&quot;,\n  &quot;colectivoId&quot;: &quot;c0e1a2b3-0000-4000-8000-000000000001&quot;,\n  &quot;proyecto&quot;: &quot;Prueba de superposicion&quot;,\n  &quot;contactoNombre&quot;: &quot;Ana&quot;,\n  &quot;contactoEmail&quot;: &quot;ana@example.org&quot;,\n  &quot;fecha&quot;: &quot;2026-11-04&quot;,\n  &quot;horaInicio&quot;: &quot;19:00&quot;\n}\u003c/textarea>\u003c/details>\n\u003cdiv class=\"pp-respuesta\">\u003c/div>\n\u003c/div>\u003cdiv class=\"pedido\">\n\u003cp class=\"pedido-titulo\">Llamada 2: Revisión de código (30 min) a las 19:30\u003c/p>\n\u003cdiv class=\"pedido-linea\">\u003cspan class=\"pedido-metodo\">POST\u003c/span>\u003cinput class=\"pedido-ruta\" aria-label=\"Ruta de la llamada 2\" value=\"/api/sesiones\" spellcheck=\"false\">\u003cbutton type=\"button\" class=\"boton\" data-simular='{&quot;estado&quot;:201,&quot;cuerpo&quot;:{&quot;id&quot;:&quot;b1e5…&quot;,&quot;mentoraId&quot;:&quot;8f3c2a1e-…&quot;,&quot;tipoAsesoriaId&quot;:&quot;revision_de_codigo&quot;,&quot;colectivoId&quot;:&quot;c0e1a2b3-…&quot;,&quot;proyecto&quot;:&quot;Prueba de superposicion&quot;,&quot;contactoNombre&quot;:&quot;Ana&quot;,&quot;contactoEmail&quot;:&quot;ana@example.org&quot;,&quot;fecha&quot;:&quot;2026-11-04&quot;,&quot;horaInicio&quot;:&quot;19:30&quot;,&quot;horaFin&quot;:&quot;20:00&quot;,&quot;estado&quot;:&quot;confirmada&quot;}}'>Enviar\u003c/button>\u003c/div>\n\u003cdetails class=\"pp-body\">\u003csummary class=\"pedido-etiqueta\">Body\u003c/summary>\u003ctextarea class=\"editor-respuestas pedido-cuerpo\" spellcheck=\"false\">{\n  &quot;mentoraId&quot;: &quot;8f3c2a1e-4b5d-4c6e-9f70-1a2b3c4d5e01&quot;,\n  &quot;tipoAsesoriaId&quot;: &quot;revision_de_codigo&quot;,\n  &quot;colectivoId&quot;: &quot;c0e1a2b3-0000-4000-8000-000000000001&quot;,\n  &quot;proyecto&quot;: &quot;Prueba de superposicion&quot;,\n  &quot;contactoNombre&quot;: &quot;Ana&quot;,\n  &quot;contactoEmail&quot;: &quot;ana@example.org&quot;,\n  &quot;fecha&quot;: &quot;2026-11-04&quot;,\n  &quot;horaInicio&quot;: &quot;19:30&quot;\n}\u003c/textarea>\u003c/details>\n\u003cdiv class=\"pp-respuesta\">\u003c/div>\n\u003c/div>\u003c/div>\n\u003cp class=\"pp-maqueta\">Maqueta: las respuestas están simuladas.\u003c/p>\n\u003c/aside>\u003cdiv class=\"markdown\">\u003cp>\u003cstrong>Como ves, la API permite superponer turnos: vamos a arreglar este bug.\u003c/strong> Antes, borrá\nesas dos reservas regenerando los datos de ejemplo:\u003c/p>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode>npm run seed\u003c/code>\u003c/pre>\u003c/div>\u003c/div>"}]},{"nombre":"Qué tenés que hacer","bajada":"Pasarle el prompt al agente, leer el log y probar el arreglo.","pantallas":[{"titulo":"El pedido","html":"\u003cdiv class=\"markdown\">\u003ch3>Ahora sí: el pedido\u003c/h3>\n\u003col>\n\u003cli>Abrí una \u003cstrong>sesión nueva\u003c/strong> del agente.\u003c/li>\n\u003cli>Copiá el prompt de \u003cspan class=\"enlace-repo\" title=\"./prompt.md\">\u003ccode>prompt.md\u003c/code>\u003c/span> \u003cstrong>tal cual\u003c/strong> y mandalo.\u003c/li>\n\u003c/ol>\n\u003c/div>\u003caside class=\"anexo-en-linea\" aria-label=\"Prompt para el agente\">\u003cdiv class=\"markdown\">\u003ch1>Prompt para el agente — Ejercicio 1\u003c/h1>\n\u003cblockquote>\n\u003cp>Copiá \u003cstrong>todo\u003c/strong> el bloque de abajo y pegalo como primer mensaje en una sesión\nnueva de tu agente (Claude Code, Codex o Cline). No le agregues nada más: la\nidea es observar qué hace el agente con exactamente este pedido.\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar prompt\u003c/button>\u003cpre>\u003ccode>Contexto: Mentorías a Voluntad es una app donde personas mentoras donan horas\nde asesoramiento y los colectivos (fundaciones, ONGs, asambleas) reservan\nsesiones. Es un repo full stack: client/ (Vite + React + TypeScript) y server/\n(Express + TypeScript en capas: routes → services → repositories → domain),\ncon los datos en archivos JSON dentro de data/. La constitution del proyecto\nestá en .specify/memory/constitution.md y dice, entre otras cosas:\n&quot;Una mentora NO PUEDE tener dos sesiones confirmadas que se superpongan&quot;.\n\nProblema: el endpoint POST /api/sesiones solo rechaza una sesión nueva si otra\nsesión confirmada de la misma mentora, el mismo día, empieza EXACTAMENTE a la\nmisma hora. Si una mentora tiene una revisión de código de 10:00 a 11:00, hoy\nun colectivo puede reservarle otra sesión de 10:30 a 11:15 y quedan\nsuperpuestas.\n\nLo que necesito:\n1. Extraé la detección de superposición a una función pura en server/domain/,\n   por ejemplo:\n   haySuperposicion(sesiones, { mentoraId, fecha, horaInicio, horaFin }): boolean\n   Solo cuentan las sesiones con estado &quot;confirmada&quot; de la misma mentora y de\n   la misma fecha. Una sesión que termina 10:30 y otra que empieza 10:30 NO se\n   superponen. La función no hace IO.\n2. Trabajá con TDD: primero escribí los tests en\n   tests/server/domain/superposicion.test.ts y un test de la API en\n   tests/server/api/ que espere el 409; corrélos y mostrame que fallan; recién\n   después implementá.\n3. Usá haySuperposicion en el caso de uso de crear sesión (capa de servicios).\n   Si hay superposición, la API responde 409 con\n   { &quot;error&quot;: &quot;El horario se superpone con otra sesión de la mentora&quot; }.\n4. No modifiques los archivos de data/. No toques los tests existentes salvo\n   que sea imprescindible; si tenés que hacerlo, avisame cuál y por qué.\n5. Al terminar, corré `npm test` y `npm run lint` y contame el resultado.\n\nAntes de editar código, explicame en 3-4 líneas tu plan.\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003c/aside>\u003cdiv class=\"markdown\">\u003c/div>"},{"titulo":"Mientras trabaja","html":"\u003cdiv class=\"markdown\">\u003col start=\"3\">\n\u003cli>\u003cp>Dejalo trabajar. Aprobá o rechazá los permisos que pida \u003cstrong>leyendo qué\npide\u003c/strong> (es parte de lo que vas a analizar después). No lo ayudes ni lo\ncorrijas salvo que se trabe por completo; si intervenís, anotalo.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Mientras trabaja, en otra terminal podés mirar el log en vivo. \u003cstrong>Poné esa terminal en pantalla completa.\u003c/strong>\u003c/p>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode># macOS / Linux\ntail -f logs/&lt;agente&gt;/&lt;id-de-sesión&gt;.jsonl\n# Windows (PowerShell)\nGet-Content logs/&lt;agente&gt;/&lt;id-de-sesión&gt;.jsonl -Wait\u003c/code>\u003c/pre>\u003c/div>\u003c/li>\n\u003c/ol>\n\u003c/div>"},{"titulo":"Leer los logs","html":"\u003cdiv class=\"markdown\">\u003ch2>Paso 2 — Leer los logs\u003c/h2>\n\u003cp>En una terminal a pantalla completa:\u003c/p>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode>npm run logs:resumen          # conteos: eventos, herramientas, comandos, archivos\nnpm run logs:timeline         # lo mismo + línea de tiempo paso a paso\u003c/code>\u003c/pre>\u003c/div>\u003cp>En la línea de tiempo cada herramienta aparece una sola vez, con su tipo de acción\n(\u003ccode>leer\u003c/code>, \u003ccode>escribir\u003c/code>, \u003ccode>ejecutar\u003c/code>, \u003ccode>buscar\u003c/code>, \u003ccode>skill\u003c/code>, \u003ccode>mcp\u003c/code>). Cuando el comando corre\nlos tests, al final de la línea se ve cómo terminó la corrida.\u003c/p>\n\u003cp>Sin opciones, el resumen muestra la \u003cstrong>última sesión con actividad\u003c/strong> (las\nsesiones vacías, que algunos agentes abren al arrancar, se saltean). Si tenés\nvarias, mirá todas con \u003ccode>npm run logs:resumen -- --todas\u003c/code>.\u003c/p>\n\u003c/div>"},{"titulo":"Probar la app modificada","html":"\u003cdiv class=\"markdown\">\u003ch2>Paso 3 — Probar la app modificada\u003c/h2>\n\u003cp>Si la app quedó modificada, probá otra vez las 2 llamadas a la API que hiciste más\narriba y compará la respuesta con lo que habías recibido antes. Si todo salió bien,\nno debería dejar superponer el turno.\u003c/p>\n\u003cp>Al terminar, borrá las reservas de prueba con \u003ccode>npm run seed\u003c/code>.\u003c/p>\n\u003c/div>\u003caside class=\"anexo-en-linea probar-api\" aria-label=\"Probar la API\">\n\u003cp class=\"pedido-nota\">Las dos van a la misma mentora, el \u003cstrong>2026-11-04\u003c/strong> (el primer día con las 19:00 libre). Mandá la 1 y después la 2.\u003c/p>\n\u003cfigure class=\"gantt\" aria-label=\"Llamada 1 de 19:00 a 19:45, llamada 2 de 19:30 a 20:00: se pisan de 19:30 a 19:45.\">\n\u003cdiv class=\"gantt-fila\" aria-hidden=\"true\">\u003cspan class=\"gantt-etiqueta\">Llamada 1\u003c/span>\u003cdiv class=\"gantt-pista\">\u003cspan class=\"gantt-barra\" style=\"left:25%;width:37.5%\">19:00–19:45\u003c/span>\u003cspan class=\"gantt-cruce\" style=\"left:50%;width:12.5%\">\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"gantt-fila\" aria-hidden=\"true\">\u003cspan class=\"gantt-etiqueta\">Llamada 2\u003c/span>\u003cdiv class=\"gantt-pista\">\u003cspan class=\"gantt-barra\" style=\"left:50%;width:25%\">19:30–20:00\u003c/span>\u003cspan class=\"gantt-cruce\" style=\"left:50%;width:12.5%\">\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"gantt-fila\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cdiv class=\"gantt-pista gantt-eje\">\u003cspan style=\"left:0%\">18:30\u003c/span>\u003cspan style=\"left:25%\">19:00\u003c/span>\u003cspan style=\"left:50%\">19:30\u003c/span>\u003cspan style=\"left:75%\">20:00\u003c/span>\u003cspan style=\"left:100%\">20:30\u003c/span>\u003c/div>\u003c/div>\n\u003c/figure>\n\u003cdiv class=\"pp-pedidos\">\u003cdiv class=\"pedido\">\n\u003cp class=\"pedido-titulo\">Llamada 1: Estrategia de testing (45 min) a las 19:00\u003c/p>\n\u003cdiv class=\"pedido-linea\">\u003cspan class=\"pedido-metodo\">POST\u003c/span>\u003cinput class=\"pedido-ruta\" aria-label=\"Ruta de la llamada 1\" value=\"/api/sesiones\" spellcheck=\"false\">\u003cbutton type=\"button\" class=\"boton\" data-simular='{&quot;estado&quot;:201,&quot;cuerpo&quot;:{&quot;id&quot;:&quot;b1e5…&quot;,&quot;mentoraId&quot;:&quot;8f3c2a1e-…&quot;,&quot;tipoAsesoriaId&quot;:&quot;estrategia_de_testing&quot;,&quot;colectivoId&quot;:&quot;c0e1a2b3-…&quot;,&quot;proyecto&quot;:&quot;Prueba de superposicion&quot;,&quot;contactoNombre&quot;:&quot;Ana&quot;,&quot;contactoEmail&quot;:&quot;ana@example.org&quot;,&quot;fecha&quot;:&quot;2026-11-04&quot;,&quot;horaInicio&quot;:&quot;19:00&quot;,&quot;horaFin&quot;:&quot;19:45&quot;,&quot;estado&quot;:&quot;confirmada&quot;}}'>Enviar\u003c/button>\u003c/div>\n\u003cdetails class=\"pp-body\">\u003csummary class=\"pedido-etiqueta\">Body\u003c/summary>\u003ctextarea class=\"editor-respuestas pedido-cuerpo\" spellcheck=\"false\">{\n  &quot;mentoraId&quot;: &quot;8f3c2a1e-4b5d-4c6e-9f70-1a2b3c4d5e01&quot;,\n  &quot;tipoAsesoriaId&quot;: &quot;estrategia_de_testing&quot;,\n  &quot;colectivoId&quot;: &quot;c0e1a2b3-0000-4000-8000-000000000001&quot;,\n  &quot;proyecto&quot;: &quot;Prueba de superposicion&quot;,\n  &quot;contactoNombre&quot;: &quot;Ana&quot;,\n  &quot;contactoEmail&quot;: &quot;ana@example.org&quot;,\n  &quot;fecha&quot;: &quot;2026-11-04&quot;,\n  &quot;horaInicio&quot;: &quot;19:00&quot;\n}\u003c/textarea>\u003c/details>\n\u003cdiv class=\"pp-respuesta\">\u003c/div>\n\u003c/div>\u003cdiv class=\"pedido\">\n\u003cp class=\"pedido-titulo\">Llamada 2: Revisión de código (30 min) a las 19:30\u003c/p>\n\u003cdiv class=\"pedido-linea\">\u003cspan class=\"pedido-metodo\">POST\u003c/span>\u003cinput class=\"pedido-ruta\" aria-label=\"Ruta de la llamada 2\" value=\"/api/sesiones\" spellcheck=\"false\">\u003cbutton type=\"button\" class=\"boton\" data-simular='{&quot;estado&quot;:409,&quot;cuerpo&quot;:{&quot;error&quot;:&quot;El horario se superpone con otra sesión de la mentora&quot;}}'>Enviar\u003c/button>\u003c/div>\n\u003cdetails class=\"pp-body\">\u003csummary class=\"pedido-etiqueta\">Body\u003c/summary>\u003ctextarea class=\"editor-respuestas pedido-cuerpo\" spellcheck=\"false\">{\n  &quot;mentoraId&quot;: &quot;8f3c2a1e-4b5d-4c6e-9f70-1a2b3c4d5e01&quot;,\n  &quot;tipoAsesoriaId&quot;: &quot;revision_de_codigo&quot;,\n  &quot;colectivoId&quot;: &quot;c0e1a2b3-0000-4000-8000-000000000001&quot;,\n  &quot;proyecto&quot;: &quot;Prueba de superposicion&quot;,\n  &quot;contactoNombre&quot;: &quot;Ana&quot;,\n  &quot;contactoEmail&quot;: &quot;ana@example.org&quot;,\n  &quot;fecha&quot;: &quot;2026-11-04&quot;,\n  &quot;horaInicio&quot;: &quot;19:30&quot;\n}\u003c/textarea>\u003c/details>\n\u003cdiv class=\"pp-respuesta\">\u003c/div>\n\u003c/div>\u003c/div>\n\u003cp class=\"pp-maqueta\">Maqueta: las respuestas están simuladas como si el agente ya hubiera arreglado el bug.\u003c/p>\n\u003c/aside>"},{"titulo":"Entrega","html":"\u003cdiv class=\"markdown\">\u003ch2>Entrega\u003c/h2>\n\u003cp>Guardá con \u003cstrong>Guardar respuestas\u003c/strong> y después hacé commit y push a la rama del grupo:\u003c/p>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode>git add -A\ngit commit -m &quot;Ejercicio 1&quot;\ngit push\u003c/code>\u003c/pre>\u003c/div>\u003cp>Por último, apretá \u003cstrong>Terminé\u003c/strong> al pie de esta página: guarda tus respuestas, habilita el tablero de \u003cstrong>Métricas\u003c/strong> (lo vas a usar desde el ejercicio 2) y te lleva al siguiente.\u003c/p>\n\u003c/div>"}]}],"partes":[{"nombre":"Lo que pasó","preguntas":[{"n":1,"titulo":"El ciclo","opcional":false,"intro":"","pista":"","subs":["¿Cuántas llamadas a herramientas hizo el agente en total?","¿Qué herramienta usó más?","Agrupalas en las familias de la charla: búsqueda de código, control de versiones, validación local, navegador, servicios."]},{"n":2,"titulo":"Explorar antes de actuar","opcional":false,"intro":"","pista":"Pista: en \u003ccode>npm run logs:timeline\u003c/code> las acciones de cada turno están en orden. Un agente también puede leer archivos desde la terminal (\u003ccode>cat\u003c/code>, \u003ccode>sed\u003c/code>, \u003ccode>Get-Content\u003c/code>): esos aparecen como \u003ccode>ejecutar\u003c/code>, no en &quot;Archivos leídos&quot;.","subs":["¿Cuántas herramientas usó \u003cstrong>antes\u003c/strong> de su primera edición de archivo?","¿Qué archivos leyó?","¿Leyó la constitution que menciona el prompt?"]},{"n":3,"titulo":"TDD de verdad","opcional":false,"intro":"El prompt pide escribir los tests, correrlos y verlos fallar antes de implementar.","pista":"Pista: mirá cómo terminó cada corrida de tests al final de su línea en \u003ccode>npm run logs:timeline\u003c/code>. Si dice &quot;resultado no detectado&quot; (por ejemplo, porque el agente filtró la salida), buscá esa llamada en el JSONL de la sesión.","subs":["Usando la línea de tiempo, ¿lo cumplió? Mostrá el orden: edición del test → \u003ccode>npm test\u003c/code> (falla) → edición de \u003ccode>server/domain/...\u003c/code> → \u003ccode>npm test\u003c/code> (pasa).","¿Por qué falló el test? No es lo mismo que falle porque \u003cem>no compila\u003c/em> (la función todavía no existe) que porque \u003cem>la regla no se cumple\u003c/em>. ¿Cuál de los dos viste?"]},{"n":4,"titulo":"Comandos de terminal","opcional":false,"intro":"","pista":"","subs":["Listá todos los comandos que ejecutó.","¿Alguno no lo pediste vos? ¿Alguno te generó dudas al aprobarlo?","Clasificá cada uno con el semáforo de la charla: verde (lectura), amarillo (validación local) o rojo (escritura o producción)."]},{"n":5,"titulo":"Errores y reintentos","opcional":false,"intro":"","pista":"","subs":["¿Alguna herramienta falló (\u003ccode>PostToolUseFailure\u003c/code> o un \u003ccode>output\u003c/code> con error)?","¿Qué hizo el agente después?"]},{"n":6,"titulo":"El resultado","opcional":false,"intro":"","pista":"","subs":["Corré vos \u003ccode>npm test\u003c/code>, \u003ccode>npm run lint\u003c/code> y \u003ccode>npm run typecheck\u003c/code> (este último el prompt no lo pidió). ¿Coinciden con lo que el agente te dijo al final? Mirá el evento \u003ccode>Stop\u003c/code> o \u003ccode>TaskComplete\u003c/code>.","¿Hizo algo que el prompt prohibía, como tocar \u003ccode>data/\u003c/code> o correr \u003ccode>npm run seed\u003c/code>?","¿Modificó algún test existente? Si lo hizo, ¿te avisó y explicó por qué era necesario?","¿Respetó las capas de la constitution (principio II)? ¿La función quedó en \u003ccode>server/domain/\u003c/code> \u003cstrong>sin IO\u003c/strong> y la ruta no habla directo con el repositorio?"]}]},{"nombre":"Lo que pensás","preguntas":[{"n":7,"titulo":"Contexto","opcional":false,"intro":"Cada \u003ccode>output\u003c/code> del log volvió al modelo como contexto.","pista":"Pista: \u003ccode>npm run logs:resumen\u003c/code> muestra cuántos caracteres devolvió cada herramienta al modelo.","subs":["Sumá aproximadamente el tamaño de las salidas: ¿qué herramienta &quot;llenó&quot; más la ventana?","¿Había lecturas que se podían evitar? Por ejemplo: ¿leyó \u003ccode>data/sesiones.json\u003c/code> entero para entender el formato, en lugar de \u003ccode>shared/types.ts\u003c/code>?"]},{"n":8,"titulo":"Comparar","opcional":true,"intro":"(opcional, si te sobra tiempo). Juntate con alguien que haya usado \u003cstrong>otro agente\u003c/strong> (o el mismo con otro modelo) y comparen los resúmenes.","pista":"","subs":["¿Qué diferencias de estrategia ven con el mismo prompt?"]},{"n":9,"titulo":"Hooks como control","opcional":false,"intro":"Este hook solo \u003cem>observa\u003c/em>. Proponé \u003cstrong>un\u003c/strong> hook que \u003cem>bloquee\u003c/em> algo en este proyecto: por ejemplo, que no deje editar \u003ccode>data/\u003c/code>, o que no deje que un archivo de \u003ccode>server/domain/\u003c/code> importe \u003ccode>fs\u003c/code> o \u003ccode>express\u003c/code>.","pista":"","subs":["¿En qué evento lo pondrías?","¿Por qué tiene que ser un hook y no una instrucción en \u003ccode>AGENTS.md\u003c/code> o en la constitution?"]},{"n":10,"titulo":"Riesgos","opcional":false,"intro":"El log guarda prompts, comandos y salidas.","pista":"","subs":["Buscá en tu log si aparece algún email y de dónde salió. Buscar solo \u003ccode>@\u003c/code> da falsos positivos (\u003ccode>@shared/types\u003c/code>), así que conviene una expresión regular. En macOS/Linux: \u003ccode>grep -rhoE &#39;[[:alnum:]._%+-]+@[[:alnum:].-]+\\.[[:alpha:]]{2,}&#39; logs/ | sort | uniq -c\u003c/code>. En PowerShell: \u003ccode>Get-ChildItem logs -Recurse -Filter *.jsonl | Select-String &#39;[\\w.%+-]+@[\\w.-]+\\.[a-zA-Z]{2,}&#39; -AllMatches | ForEach-Object { $_.Matches.Value } | Group-Object | Select-Object Count, Name\u003c/code>. También podés abrir el \u003ccode>.jsonl\u003c/code> de la sesión en el editor y buscar con \u003ccode>Ctrl+F\u003c/code>, activando la opción de expresión regular, el patrón \u003ccode>[\\w.%+-]+@[\\w.-]+\\.[a-zA-Z]{2,}\u003c/code>.","El principio IV de la constitution dice que los datos de contacto nunca salen por la API… pero el agente puede leer \u003ccode>data/\u003c/code> directamente. ¿Qué datos sensibles podrían terminar en el log en un proyecto real (por ejemplo, en el TP con MongoDB)?","¿El log debería versionarse? (Pista: mirá el \u003ccode>.gitignore\u003c/code>.)"]}]}],"placeholder":""},"02-skill-y-mcp":{"titulo":"Escribir una skill y conectar un MCP","numero":2,"minutos":35,"charla":"\u003cdiv class=\"markdown\">\u003cblockquote>\n\u003cp>\u003cstrong>Charla:\u003c/strong> bloque 2.1.3 \u003cem>Skills\u003c/em> (el mismo pedido, eso es una skill, una\nskill por dentro, una skill no es un script, cómo el agente la encuentra,\ncuándo nace una skill) y 2.1.1 \u003cem>Context engineering\u003c/em> (las palancas: skills y\nMCP entran al contexto solo cuando se usan).\u003c/p>\n\u003cp>\u003cstrong>Requisito:\u003c/strong> ejercicio 1 hecho; los hooks siguen registrando todo, y los\nvas a usar para comprobar que la skill y el MCP se activaron.\u003c/p>\n\u003c/blockquote>\n\u003c/div>","etapas":[{"nombre":"Contexto técnico","bajada":"Qué es una skill, qué es un MCP y dónde va cada uno según tu agente.","pantallas":[{"titulo":"Skill y MCP","html":"\u003cdiv class=\"markdown\">\u003ch2>Objetivo\u003c/h2>\n\u003cp>Dos piezas del harness que se suman al agente:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Qué aporta\u003c/th>\n\u003cth>En la charla\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Skill\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Criterio\u003c/strong>: cómo hacemos las cosas en \u003cem>este\u003c/em> repo. Escrito una vez, versionado con el código.\u003c/td>\n\u003ctd>«Documentar el criterio en el repositorio»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>MCP\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Herramientas\u003c/strong> nuevas: el agente puede observar y actuar sobre algo que antes no veía (acá, un navegador).\u003c/td>\n\u003ctd>«Sumar herramientas amplía lo observable»\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode>npm run logs:limpiar    # medí solo este ejercicio\u003c/code>\u003c/pre>\u003c/div>\u003c/div>"},{"titulo":"El tablero de Métricas","html":"\u003caside class=\"anexo-en-linea\" aria-label=\"El tablero de Métricas\">\u003cdiv class=\"markdown\">\u003ch3>Antes de empezar: el tablero de Métricas\u003c/h3>\n\u003cp>Hasta ahora estuvimos viendo el uso del agente desde los logs, pero esto se puede\nrepresentar de una forma más visual, que facilita los ejercicios que siguen. El\ntablero de \u003cstrong>Métricas\u003c/strong> lee los mismos archivos de \u003ccode>logs/\u003c/code> y se actualiza solo:\neventos por minuto, herramientas, fallas, archivos y duración de cada acción.\nAdemás muestra \u003cstrong>tokens, modelo y costo estimado\u003c/strong>, que los hooks no mandan: salen\nde la transcripción que cada agente guarda en tu equipo. Para ver los comandos\ncompletos, con las claves tapadas, activá &quot;Mostrar comandos completos&quot;. Solo se ve\ndesde tu propia máquina.\u003c/p>\n\u003cp>\u003ca href=\"/metricas\" class=\"boton boton-enlace\" target=\"_blank\" rel=\"noreferrer\">Ver métricas\u003c/a>\u003c/p>\n\u003cp>Usalo para mirar, pero en las respuestas seguí citando el log (\u003ccode>logs:resumen\u003c/code> /\n\u003ccode>logs:timeline\u003c/code>) como evidencia.\u003c/p>\n\u003c/div>\u003c/aside>"},{"titulo":"Dónde va la skill","html":"\u003cdiv class=\"markdown\">\u003cp>Creá la skill en la carpeta que lee tu agente:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Agente\u003c/th>\n\u003cth>Ubicación\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Claude Code\u003c/td>\n\u003ctd>\u003ccode>.claude/skills/nuevo-endpoint/SKILL.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cline\u003c/td>\n\u003ctd>\u003ccode>.claude/skills/nuevo-endpoint/SKILL.md\u003c/code> (Cline lee las skills del proyecto desde \u003ccode>.claude/skills/\u003c/code>, \u003ccode>.cline/skills/\u003c/code> y \u003ccode>.clinerules/skills/\u003c/code>: usa las del repo sin copiarlas)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Codex\u003c/td>\n\u003ctd>\u003ccode>.agents/skills/nuevo-endpoint/SKILL.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>Mirá las skills que ya tiene el repo (por ejemplo\n\u003ccode>.claude/skills/speckit-specify/\u003c/code>) como referencia de formato.\u003c/p>\n\u003c/blockquote>\n\u003c/div>"},{"titulo":"El encabezado de la skill","html":"\u003cdiv class=\"markdown\">\u003cp>Tiene que tener las dos partes que vimos en la charla:\u003c/p>\n\u003cp>\u003cstrong>Arriba, el encabezado\u003c/strong> (frontmatter YAML). Determina \u003cstrong>cuándo\u003c/strong> se activa:\u003c/p>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode>---\nname: nuevo-endpoint\ndescription: &lt;qué trabajo hace + en qué momento usarla&gt;\n---\u003c/code>\u003c/pre>\u003c/div>\u003cp>Recordá: «Ayuda con la API» no dispara nunca. La \u003ccode>description\u003c/code> tiene que\n\u003cstrong>nombrar el trabajo y nombrar el momento\u003c/strong>, con las palabras que vos vas a\nusar al pedirlo (endpoint, ruta, API, handler, \u003ccode>server/routes\u003c/code>, Express...).\u003c/p>\n\u003c/div>"},{"titulo":"Conectar el MCP","html":"\u003cdiv class=\"markdown\">\u003ch3>B.1 Conectalo\u003c/h3>\n\u003cdetails>\n\u003csummary>\u003cb>Claude Code\u003c/b>\u003c/summary>\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode>claude mcp add playwright --scope project -- npx -y @playwright/mcp@latest\u003c/code>\u003c/pre>\u003c/div>\u003cp>Esto crea \u003ccode>.mcp.json\u003c/code> en la raíz (configuración de proyecto, versionable). Al\nabrir \u003ccode>claude\u003c/code> te va a pedir aprobar el servidor del proyecto. Verificá con\n\u003ccode>/mcp\u003c/code>.\u003c/p>\n\u003c/details>\u003cdetails>\n\u003csummary>\u003cb>Codex CLI\u003c/b>\u003c/summary>\u003cp>Agregalo en \u003ccode>.codex/config.toml\u003c/code> del repo (solo se carga si el proyecto está\nmarcado como confiable, como en el ejercicio 1) o en \u003ccode>~/.codex/config.toml\u003c/code>:\u003c/p>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode>[mcp_servers.playwright]\ncommand = &quot;npx&quot;\nargs = [&quot;-y&quot;, &quot;@playwright/mcp@latest&quot;]\u003c/code>\u003c/pre>\u003c/div>\u003cp>Verificá con \u003ccode>/mcp\u003c/code> dentro de Codex.\u003c/p>\n\u003c/details>\u003cdetails>\n\u003csummary>\u003cb>Cline\u003c/b>\u003c/summary>\u003cp>Cline no tiene configuración de MCP por proyecto. Con el CLI (\u003ccode>cline\u003c/code>), mirá cómo configurar\nMCP en la \u003ca href=\"https://docs.cline.bot/cline-cli/installation\" target=\"_blank\" rel=\"noreferrer\">guía del CLI\u003c/a>. En la extensión de VS Code,\nen el panel de Cline: \u003cstrong>MCP Servers → Configure → Configure MCP Servers\u003c/strong>, y agregá:\u003c/p>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode>{\n  &quot;mcpServers&quot;: {\n    &quot;playwright&quot;: {\n      &quot;command&quot;: &quot;npx&quot;,\n      &quot;args&quot;: [&quot;-y&quot;, &quot;@playwright/mcp@latest&quot;],\n      &quot;disabled&quot;: false,\n      &quot;autoApprove&quot;: []\n    }\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\u003cblockquote>\n\u003cp>\u003cstrong>Antes de la clase\u003c/strong> (o antes de empezar este ejercicio), bajá el navegador y\nprecalentá el MCP, para que no se trabe descargando en el momento:\u003c/p>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode>npx playwright install chromium\nnpx -y @playwright/mcp@latest --help\u003c/code>\u003c/pre>\u003c/div>\u003cp>Si Playwright no encuentra un navegador, repetí \u003ccode>npx playwright install chromium\u003c/code>.\u003c/p>\n\u003c/blockquote>\n\u003c/div>"}]},{"nombre":"Contexto del ejercicio","bajada":"Por qué nace la skill y qué decisión de privacidad tiene el endpoint que le vas a pedir.","pantallas":[{"titulo":"El problema","html":"\u003cdiv class=\"markdown\">\u003ch3>A.1 El problema\u003c/h3>\n\u003cp>En el ejercicio 1 le explicaste al agente, dentro del prompt, varias reglas del\nproyecto: en qué capa va cada cosa, dónde van los tests, qué código HTTP\ndevolver, que no toque \u003ccode>data/\u003c/code>... Si mañana le pedís otro endpoint, \u003cstrong>se lo\nvas a tener que repetir\u003c/strong>. Ese es el momento en que nace una skill.\u003c/p>\n\u003c/div>"},{"titulo":"La privacidad del endpoint","html":"\u003cdiv class=\"markdown\">\u003ch3>A.4 La privacidad del endpoint\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>Decisión de producto para este endpoint: no devuelve \u003ccode>contactoNombre\u003c/code> ni\n\u003ccode>contactoEmail\u003c/code>.\u003c/strong>\u003c/p>\n\u003cp>El pedido no lo dice a propósito: queremos ver si la skill (o la\nconstitution) alcanza para que el agente lo resuelva solo.\u003c/p>\n\u003cp>\u003cstrong>¿Por qué?\u003c/strong> El principio IV dice que los datos de contacto del colectivo\nsolo se muestran \u003cem>a la mentora de esa sesión\u003c/em>. La app no tiene login, así que\nel servidor no tiene forma de saber quién pide \u003ccode>GET /api/sesiones/:id\u003c/code>. Un\nUUID en una URL \u003cstrong>no es una credencial\u003c/strong>: se comparte, queda en el historial\ny en los logs.\u003c/p>\n\u003cp>\u003cstrong>Entonces:\u003c/strong> el endpoint devuelve la misma vista pública que\n\u003ccode>GET /api/sesiones\u003c/code> (\u003ccode>SesionPublica\u003c/code>): los ids de mentora, tipo de asesoría y\ncolectivo, el proyecto, la fecha, el horario y el estado. Revelar el contacto\n&quot;a quien corresponde&quot; es una feature en sí misma (ver la iteración 5 del\nejercicio 3).\u003c/p>\n\u003cp>Si tu agente lo devolvió, no lo corrijas a mano: mejorá la skill y repetí.\u003c/p>\n\u003c/blockquote>\n\u003c/div>"}]},{"nombre":"Qué tenés que hacer","bajada":"Escribir la skill, comprobar que se dispara, conectar el navegador y usarlo.","pantallas":[{"titulo":"El criterio de la skill (1 de 2)","html":"\u003cdiv class=\"markdown\">\u003cp>\u003cstrong>Abajo, el criterio\u003c/strong> (markdown común): cómo lo hacemos \u003cem>nosotros\u003c/em>. Como\nmínimo tiene que cubrir estos puntos.\u003c/p>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>Antes de escribir, preguntá.\u003c/strong>\u003cul>\n\u003cli>¿Quién lo consume: una pantalla del client, la mentora, el colectivo?\u003c/li>\n\u003cli>¿Qué pasa si falla?\u003c/li>\n\u003cli>¿Qué valida?\u003c/li>\n\u003cli>¿Devuelve algún dato personal?\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>Dónde va cada cosa\u003c/strong> (principio II).\u003cul>\n\u003cli>\u003ccode>server/routes/\u003c/code>: la ruta, solo HTTP (parsear, validar forma, mapear\nerrores a status).\u003c/li>\n\u003cli>\u003ccode>server/services/\u003c/code>: el caso de uso.\u003c/li>\n\u003cli>\u003ccode>server/repositories/\u003c/code>: el acceso a los JSON.\u003c/li>\n\u003cli>\u003ccode>server/domain/\u003c/code>: las reglas puras, sin \u003ccode>fs\u003c/code> ni \u003ccode>express\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>shared/types.ts\u003c/code>: los tipos.\u003c/li>\n\u003cli>\u003ccode>client/src/api/\u003c/code>: la función de fetch, si una pantalla lo consume\n(principio VI).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>Contrato de API\u003c/strong> (principio III).\u003cul>\n\u003cli>Todo bajo \u003ccode>/api\u003c/code>, en JSON.\u003c/li>\n\u003cli>Recursos en plural y kebab-case: \u003ccode>/api/tipos-asesoria\u003c/code>,\n\u003ccode>/api/sesiones/:id\u003c/code>.\u003c/li>\n\u003cli>Errores con cuerpo \u003ccode>{ &quot;error&quot;: &quot;&lt;mensaje en español&gt;&quot; }\u003c/code>: \u003ccode>400\u003c/code>\nvalidación · \u003ccode>404\u003c/code> no existe · \u003ccode>409\u003c/code> conflicto de estado.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003c/div>"},{"titulo":"El criterio de la skill (2 de 2)","html":"\u003cdiv class=\"markdown\">\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>Convenciones del dominio\u003c/strong> (principio V).\u003cul>\n\u003cli>Entidades y campos en español: \u003ccode>mentoraId\u003c/code>, \u003ccode>horaInicio\u003c/code>, \u003ccode>estado\u003c/code>.\u003c/li>\n\u003cli>IDs UUID v4 con \u003ccode>crypto.randomUUID()\u003c/code> para lo que crean los usuarios.\u003c/li>\n\u003cli>Habilidades y tipos de asesoría se identifican por su \u003cstrong>código\nsnake_case\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>Privacidad\u003c/strong> (principio IV).\u003cul>\n\u003cli>El \u003ccode>contacto\u003c/code> de la mentora no sale \u003cstrong>nunca\u003c/strong>.\u003c/li>\n\u003cli>Los datos de contacto del colectivo, solo a quien corresponde.\u003c/li>\n\u003cli>El servicio devuelve una \u003cstrong>vista pública explícita\u003c/strong>: elegir campos, no\nhacer \u003ccode>{ ...sesion }\u003c/code>.\u003c/li>\n\u003cli>Hay un test que verifica que el dato privado \u003cstrong>no\u003c/strong> está en la respuesta.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>TDD con supertest\u003c/strong> (principio I).\u003cul>\n\u003cli>Primero el test en \u003ccode>tests/server/api/\u003c/code> (y en \u003ccode>tests/server/domain/\u003c/code> si hay\nlógica nueva), verlo fallar y después implementar.\u003c/li>\n\u003cli>Los tests de API usan la app de Express sin levantar el puerto y un\n\u003cstrong>\u003ccode>DATA_DIR\u003c/code> temporal\u003c/strong>: nunca leen ni escriben \u003ccode>data/\u003c/code>.\u003c/li>\n\u003cli>Indicá que mire cómo lo hacen los tests existentes.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003cstrong>Nunca cerrar sin un caso borde ni sin validar.\u003c/strong>\u003cul>\n\u003cli>Al menos un caso borde: id inexistente o mal formado (\u003ccode>404\u003c/code>, igual que\n\u003ccode>GET /api/mentoras/:id\u003c/code>) o campo faltante (\u003ccode>400\u003c/code>).\u003c/li>\n\u003cli>Correr \u003ccode>npm test\u003c/code>, \u003ccode>npm run lint\u003c/code> y \u003ccode>npm run typecheck\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cp>Opcional (recordá \u003cem>«una skill no es un script»\u003c/em>): si hay un paso\ndeterminístico, como chequear que el endpoint responde con el server\nlevantado, ponelo en \u003ccode>nuevo-endpoint/scripts/\u003c/code> y hacé que la skill lo invoque.\u003c/p>\n\u003c/div>"},{"titulo":"¿Se dispara?","html":"\u003cdiv class=\"markdown\">\u003ch3>A.3 ¿Se dispara?\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>Probala siempre en una sesión nueva\u003c/strong>, abierta \u003cem>después\u003c/em> de guardar el\n\u003ccode>SKILL.md\u003c/code>. En la sesión donde la escribiste el agente ya sabe que existe, y\nla prueba no vale.\u003c/p>\n\u003c/blockquote>\n\u003col>\n\u003cli>\u003cp>Sesión nueva. Preguntale al agente: \u003cstrong>&quot;¿Cuándo usarías la skill\nnuevo-endpoint?&quot;\u003c/strong> Si la respuesta no coincide con lo que querías, mejorá la\n\u003ccode>description\u003c/code>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Otra sesión nueva. Pedile, \u003cstrong>sin nombrar la skill\u003c/strong> y sin agregar nada más:\u003c/p>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar prompt\u003c/button>\u003cpre>\u003ccode>Necesito un endpoint para obtener el detalle de una sesión por su id:\nGET /api/sesiones/:id. Si no existe, 404.\u003c/code>\u003c/pre>\u003c/div>\u003c/li>\n\u003cli>\u003cp>Revisalo en el tablero de \u003cstrong>\u003ca href=\"/metricas\" target=\"_blank\" rel=\"noreferrer\">Métricas\u003c/a>\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>La skill tiene que aparecer en \u003cstrong>Subagentes, skills y MCP\u003c/strong>. Si no aparece,\nla skill no se activó y esta parte no está terminada.\u003c/li>\n\u003cli>Anotá el \u003ccode>session\u003c/code> de esa prueba (lo ves en \u003cstrong>Sesiones recientes\u003c/strong>): lo vas\na necesitar en la pregunta 1.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n\u003cp>Si no se activó, \u003cstrong>no le digas que la use\u003c/strong>: cambiá la \u003ccode>description\u003c/code> y probá\nde nuevo en una sesión limpia. Anotá cuántos intentos te llevó.\u003c/p>\n\u003c/div>"},{"titulo":"Verificá el endpoint","html":"\u003cdiv class=\"markdown\">\u003cp>Verificalo vos, cuando el agente haya creado \u003ccode>GET /api/sesiones/:id\u003c/code>: pedí una sesión\nexistente y una que no existe, y fijate qué campos y qué status devuelve cada una.\nAntes de ese cambio las dos dan 404, porque la ruta todavía no existe. Podés cambiar la ruta de cada llamada:\u003c/p>\n\u003c/div>\u003caside class=\"anexo-en-linea probar-api\" aria-label=\"Consultar sesiones\">\u003cdiv class=\"pp-pedidos\">\n\u003cdiv class=\"pedido\">\n\u003cp class=\"pedido-titulo\">Llamada 1: Una sesión que existe\u003c/p>\n\u003cdiv class=\"pedido-linea\">\u003cspan class=\"pedido-metodo\">GET\u003c/span>\u003cinput class=\"pedido-ruta\" aria-label=\"Ruta de la llamada 1\" value=\"/api/sesiones/3f9c…\" spellcheck=\"false\">\u003cbutton type=\"button\" class=\"boton\" data-simular='{&quot;estado&quot;:200,&quot;cuerpo&quot;:{&quot;id&quot;:&quot;3f9c…&quot;,&quot;mentoraId&quot;:&quot;8f3c2a1e-…&quot;,&quot;tipoAsesoriaId&quot;:&quot;revision_de_codigo&quot;,&quot;colectivoId&quot;:&quot;c0e1a2b3-…&quot;,&quot;proyecto&quot;:&quot;Huerta comunitaria&quot;,&quot;fecha&quot;:&quot;2026-11-09&quot;,&quot;horaInicio&quot;:&quot;18:00&quot;,&quot;horaFin&quot;:&quot;18:30&quot;,&quot;estado&quot;:&quot;confirmada&quot;}}'>Enviar\u003c/button>\u003c/div>\n\n\u003cdiv class=\"pp-respuesta\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"pedido\">\n\u003cp class=\"pedido-titulo\">Llamada 2: Una sesión que no existe\u003c/p>\n\u003cdiv class=\"pedido-linea\">\u003cspan class=\"pedido-metodo\">GET\u003c/span>\u003cinput class=\"pedido-ruta\" aria-label=\"Ruta de la llamada 2\" value=\"/api/sesiones/no-existe\" spellcheck=\"false\">\u003cbutton type=\"button\" class=\"boton\" data-simular='{&quot;estado&quot;:404,&quot;cuerpo&quot;:{&quot;error&quot;:&quot;No existe la sesión&quot;}}'>Enviar\u003c/button>\u003c/div>\n\n\u003cdiv class=\"pp-respuesta\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"pedido\">\n\u003cp class=\"pedido-titulo\">Llamada 3: El listado que ya existía\u003c/p>\n\u003cdiv class=\"pedido-linea\">\u003cspan class=\"pedido-metodo\">GET\u003c/span>\u003cinput class=\"pedido-ruta\" aria-label=\"Ruta de la llamada 3\" value=\"/api/sesiones\" spellcheck=\"false\">\u003cbutton type=\"button\" class=\"boton\" data-simular='{&quot;estado&quot;:200,&quot;cuerpo&quot;:[{&quot;id&quot;:&quot;3f9c…&quot;,&quot;mentoraId&quot;:&quot;8f3c2a1e-…&quot;,&quot;tipoAsesoriaId&quot;:&quot;revision_de_codigo&quot;,&quot;colectivoId&quot;:&quot;c0e1a2b3-…&quot;,&quot;proyecto&quot;:&quot;Huerta comunitaria&quot;,&quot;fecha&quot;:&quot;2026-11-09&quot;,&quot;horaInicio&quot;:&quot;18:00&quot;,&quot;horaFin&quot;:&quot;18:30&quot;,&quot;estado&quot;:&quot;confirmada&quot;},&quot;…&quot;]}'>Enviar\u003c/button>\u003c/div>\n\n\u003cdiv class=\"pp-respuesta\">\u003c/div>\n\u003c/div>\u003c/div>\n\u003cp class=\"pp-maqueta\">Maqueta: las respuestas están simuladas como si el agente ya hubiera creado el endpoint.\u003c/p>\n\u003c/aside>\u003cdiv class=\"markdown\">\u003c/div>"},{"titulo":"Usá el navegador","html":"\u003cdiv class=\"markdown\">\u003ch3>B.2 Usalo\u003c/h3>\n\u003cp>Con \u003ccode>npm run dev\u003c/code> corriendo (client en \u003ca href=\"http://localhost:5173\" target=\"_blank\" rel=\"noreferrer\">http://localhost:5173\u003c/a>, API en\n\u003ca href=\"http://localhost:3001\" target=\"_blank\" rel=\"noreferrer\">http://localhost:3001\u003c/a>; si el 5173 está ocupado, Vite usa el 5174: pasale esa URL al\nagente), pedile al agente:\u003c/p>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar prompt\u003c/button>\u003cpre>\u003ccode>Con el navegador, entrá a http://localhost:5173 y reservá una sesión de\nmentoría como si fueras un colectivo: filtrá las mentoras por una habilidad,\nelegí una mentora, un tipo de asesoría, un día y un horario, completá los\ndatos del colectivo (colectivo, proyecto, nombre y email de contacto) y\nconfirmá. Después verificá con el endpoint GET /api/sesiones/:id que hiciste\nantes que la sesión quedó guardada con los datos correctos. Revisá también las\nrequests de red: ¿alguna respuesta de la API incluye el email de una mentora?\nSacá una captura de la pantalla de confirmación, guardala en\nejercicios/02-skill-y-mcp/captura-confirmacion.png y contame cualquier problema\nde usabilidad o accesibilidad que encuentres (por ejemplo, ¿se puede hacer\ntodo con teclado? ¿se ve bien a 375px de ancho?). Usá el navegador en modo\nvisible (headed, no headless), así puedo ver en vivo lo que hacés.\u003c/code>\u003c/pre>\u003c/div>\u003cp>Al terminar, \u003cstrong>regenerá los datos de ejemplo\u003c/strong> para descartar la reserva que\nhizo el agente: \u003ccode>npm run seed\u003c/code> (\u003ccode>data/sesiones.json\u003c/code> no se versiona, así que\n\u003ccode>git checkout\u003c/code> no sirve acá).\u003c/p>\n\u003c/div>"},{"titulo":"Mirá lo que pasó","html":"\u003cdiv class=\"markdown\">\u003ch3>B.3 Mirá lo que pasó\u003c/h3>\n\u003cp>\u003ccode>npm run logs:resumen\u003c/code> muestra una sección \u003cstrong>Herramientas MCP\u003c/strong>. Las tools de\nMCP aparecen con nombres como \u003ccode>mcp__playwright__browser_navigate\u003c/code> (Claude\nCode y Codex) o \u003ccode>use_mcp_tool\u003c/code> (Cline).\u003c/p>\n\u003c/div>"},{"titulo":"Parte C, opcional (1 de 3)","html":"\u003cdiv class=\"markdown\">\u003ch2>Parte C (opcional) — Una skill que se dispara por el archivo: códigos de habilidad\u003c/h2>\n\u003cp>En el TP \u003cem>Código a Voluntad\u003c/em> cada habilidad tiene un \u003cstrong>código único\nnormalizado\u003c/strong>, y este proyecto hereda la regla (principio V): &quot;Desarrollo Web\nReact&quot; → \u003ccode>desarrollo_web_react\u003c/code>.\u003c/p>\n\u003cp>Es el tercer camino de disparo de la charla: \u003cstrong>la extensión\u003c/strong>. Igual que \u003cem>«al\neditar un \u003ccode>.py\u003c/code> se carga la skill de nomenclatura en Python»\u003c/em>, acá queremos que\nal tocar un archivo \u003ccode>.ts\u003c/code> que maneja habilidades o tipos de asesoría se cargue\nla skill \u003ccode>codigos-de-habilidad\u003c/code>.\u003c/p>\n\u003ch3>C.1 Creá la skill\u003c/h3>\n\u003cul>\n\u003cli>Ubicación: \u003ccode>.claude/skills/codigos-de-habilidad/SKILL.md\u003c/code> (o la carpeta de\ntu agente).\u003c/li>\n\u003cli>En Claude Code, además de la \u003ccode>description\u003c/code>, el encabezado acepta el campo\n\u003ccode>paths\u003c/code> con globs de archivos que activan la skill. Es propio de Claude\nCode, no del estándar: revisá la documentación de tu versión.\u003c/li>\n\u003cli>Pensá bien el glob: ¿\u003ccode>**/*.ts\u003c/code>? ¿O solo los archivos de habilidades y tipos\nde asesoría?\u003c/li>\n\u003c/ul>\n\u003c/div>"},{"titulo":"Parte C, opcional (2 de 3)","html":"\u003cdiv class=\"markdown\">\u003ch3>C.2 Separá script de criterio\u003c/h3>\n\u003cp>Recordá \u003cem>«una skill no es un script»\u003c/em>.\u003c/p>\n\u003cp>\u003cstrong>Script\u003c/strong> (\u003ccode>scripts/normalizar.mjs\u003c/code>): los pasos fijos.\u003c/p>\n\u003col>\n\u003cli>Pasar a minúsculas.\u003c/li>\n\u003cli>Sacar tildes y diéresis; \u003ccode>ñ\u003c/code> → \u003ccode>n\u003c/code>.\u003c/li>\n\u003cli>Todo lo que no sea letra o número pasa a \u003ccode>_\u003c/code>.\u003c/li>\n\u003cli>Colapsar los \u003ccode>_\u003c/code> repetidos.\u003c/li>\n\u003cli>Sacar los \u003ccode>_\u003c/code> del principio y del final.\u003c/li>\n\u003c/ol>\n\u003cp>Ejemplos: \u003ccode>&quot;  Diseño UX/UI &quot;\u003c/code> → \u003ccode>diseno_ux_ui\u003c/code> · \u003ccode>&quot;Node.js&quot;\u003c/code> → \u003ccode>node_js\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Criterio\u003c/strong> (el \u003ccode>SKILL.md\u003c/code>): lo que hay que decidir.\u003c/p>\n\u003cul>\n\u003cli>¿Qué pasa si el código normalizado \u003cstrong>ya existe\u003c/strong>? &quot;React&quot; y &quot;react &quot;\ncolisionan: se reutiliza, no se duplica.\u003c/li>\n\u003cli>¿Y si dos habilidades distintas colapsan al mismo código? \u003ccode>&quot;C#&quot;\u003c/code> → \u003ccode>c\u003c/code>,\nigual que \u003ccode>&quot;C&quot;\u003c/code>.\u003c/li>\n\u003cli>¿Se puede cambiar el código de una habilidad que ya usan mentoras y tipos de\nasesoría?\u003c/li>\n\u003cli>¿Cuándo frenar y preguntarle al humano?\u003c/li>\n\u003c/ul>\n\u003c/div>"},{"titulo":"Parte C, opcional (3 de 3)","html":"\u003cdiv class=\"markdown\">\u003ch3>C.3 Probalo sin nombrarla\u003c/h3>\n\u003cp>Pedile: \u003cem>&quot;Agregá la habilidad &#39;Accesibilidad Web (WCAG)&#39; al catálogo y\nasociala al tipo de asesoría de revisión de código.&quot;\u003c/em>\u003c/p>\n\u003cul>\n\u003cli>¿Se cargó la skill?\u003c/li>\n\u003cli>¿Corrió el script o normalizó &quot;a ojo&quot;?\u003c/li>\n\u003c/ul>\n\u003c/div>"},{"titulo":"Entrega","html":"\u003cdiv class=\"markdown\">\u003ch2>Entrega\u003c/h2>\n\u003cp>Guardá con \u003cstrong>Guardar respuestas\u003c/strong> y después hacé commit y push a la rama del grupo:\u003c/p>\n\u003cdiv class=\"codigo\">\u003cbutton type=\"button\" class=\"boton-copiar\" data-copiar>Copiar\u003c/button>\u003cpre>\u003ccode>git add -A\ngit commit -m &quot;Ejercicio 2&quot;\ngit push\u003c/code>\u003c/pre>\u003c/div>\u003cp>Por último, apretá \u003cstrong>Terminé\u003c/strong> al pie de esta página: guarda tus respuestas y te lleva al ejercicio 3.\u003c/p>\n\u003c/div>"}]}],"partes":[{"nombre":"La skill","preguntas":[{"n":1,"titulo":"La \u003ccode>description\u003c/code>","opcional":false,"intro":"","pista":"","subs":["Pegá tu \u003ccode>description\u003c/code> final.","¿Cuántas versiones probaste hasta que se disparó sola en una sesión nueva? Indicá el \u003ccode>session\u003c/code> del log de la prueba que funcionó.","¿Qué cambió entre la primera y la última?"]},{"n":2,"titulo":"Cuándo se cargó","opcional":false,"intro":"","pista":"","subs":["¿En qué momento de la sesión el agente cargó la skill: antes o después de leer código? Mostralo con la línea de tiempo."]},{"n":3,"titulo":"¿Siguió el criterio?","opcional":false,"intro":"","pista":"","subs":["Elegí \u003cstrong>dos\u003c/strong> reglas de tu skill y mostrá en el diff que el agente las cumplió. Por ejemplo: la capa en la que puso cada cosa, o el test con \u003ccode>DATA_DIR\u003c/code> temporal.","¿Alguna la ignoró? ¿Por qué creés que pasó?"]}]},{"nombre":"La privacidad y el contexto","preguntas":[{"n":4,"titulo":"Privacidad","opcional":false,"intro":"","pista":"","subs":["¿La respuesta de \u003ccode>GET /api/sesiones/:id\u003c/code> incluye \u003ccode>contactoEmail\u003c/code>?","Si no, ¿lo decidió por tu skill, por la constitution o por casualidad? Buscá en el log qué leyó antes de escribir el servicio.","¿Hay un test que lo verifique?","Revisá también \u003ccode>GET /api/sesiones\u003c/code>, que ya existía: ¿es coherente con tu endpoint?"]},{"n":5,"titulo":"Prompt contra skill","opcional":false,"intro":"Compará este pedido (2 líneas + skill) con el prompt del ejercicio 1 (~30 líneas).","pista":"","subs":["¿Qué parte del prompt del ejercicio 1 ya no hace falta escribir?","¿Qué parte \u003cstrong>sí\u003c/strong> sigue haciendo falta, porque es propia de cada pedido?"]},{"n":6,"titulo":"Contexto","opcional":false,"intro":"La charla dice: \u003cem>«la skill entra con su descripción y el cuerpo solo cuando se usa»\u003c/em>.","pista":"","subs":["¿Por qué eso importa para la ventana de contexto?","¿Qué pasaría si todo el criterio estuviera en \u003ccode>AGENTS.md\u003c/code> o en la constitution?"]}]},{"nombre":"El MCP conectado","preguntas":[{"n":7,"titulo":"Costo de tener MCP conectados","opcional":false,"intro":"Abrí la lista de herramientas del servidor (\u003ccode>/mcp\u003c/code> o el panel de MCP).","pista":"","subs":["¿Cuántas expone?","¿Conviene tener muchos MCP conectados todo el tiempo? ¿Qué le cuesta eso al contexto?"]}]},{"nombre":"Lo que hizo en el navegador","preguntas":[{"n":8,"titulo":"Lo que encontró","opcional":false,"intro":"","pista":"","subs":["¿Encontró algún problema real en la app usando el navegador que no se veía con los tests? Por ejemplo: de usabilidad, de accesibilidad o un dato privado en la red.","¿Qué no pudo verificar?"]},{"n":9,"titulo":"Permisos","opcional":false,"intro":"","pista":"","subs":["En el semáforo de herramientas de la charla, ¿de qué color es un navegador controlado por el agente? Tené en cuenta que en B.2 \u003cstrong>creó\u003c/strong> una sesión.","¿Qué permisos le diste?","¿Cuáles no le darías en un proyecto real, por ejemplo contra la app en producción?"]}]},{"nombre":"Las herramientas del MCP","preguntas":[{"n":10,"titulo":"Herramientas usadas","opcional":false,"intro":"","pista":"Pista: el resumen tiene una sección con el tamaño de lo que devolvió cada herramienta.","subs":["¿Qué herramientas del MCP usó el agente y cuántas veces cada una?","¿Cuál devolvió las salidas más grandes?"]},{"n":11,"titulo":"Una skill que usa el MCP","opcional":false,"intro":"Skill y MCP: uno aporta \u003cem>criterio\u003c/em>, el otro \u003cem>herramientas\u003c/em>.","pista":"","subs":["Proponé una skill para este repo que \u003cstrong>use\u003c/strong> el MCP de Playwright. Por ejemplo: &quot;verificar un flujo de reserva contra los escenarios de una spec&quot;.","Escribí solo el encabezado y 5-6 líneas de criterio."]}]},{"nombre":"La Parte C (si la hiciste)","preguntas":[{"n":12,"titulo":"La skill por archivo","opcional":true,"intro":"","pista":"","subs":["¿Se disparó la skill \u003ccode>codigos-de-habilidad\u003c/code> al editar el archivo? Mostralo con el log.","¿Qué glob usaste en \u003ccode>paths\u003c/code> y por qué no \u003ccode>**/*.ts\u003c/code>?","¿Qué decidiste dejar en el script y qué en el criterio?"]}]}],"placeholder":""}};

/* ── Estado ── */
function leer(clave, defecto) { try { const v = localStorage.getItem(clave); return v === null ? defecto : JSON.parse(v); } catch { return defecto; } }
function guardar(clave, valor) { try { localStorage.setItem(clave, JSON.stringify(valor)); } catch {} }
const PREGUNTAS = 'preguntas';
const IDS = Object.keys(DATOS);
const estado = { ej: IDS[0], porEj: Object.fromEntries(IDS.map((id) => [id, { pos: 0, alcanzada: 0, ultima: 0, respuestas: {} }])) };
for (const [id, p] of Object.entries(leer('consigna-por-etapas', {}))) if (estado.porEj[id]) estado.porEj[id] = p;
const prog = () => estado.porEj[estado.ej];
const persistir = () => guardar('consigna-por-etapas', estado.porEj);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Todas las pantallas del ejercicio, en orden, con la etapa a la que pertenecen. */
function pantallas(ej) {
  return ej.etapas.flatMap((e, i) => e.pantallas.map((p, j) => ({ ...p, etapa: i, j, de: e.pantallas.length })));
}

function contar(ej) {
  const r = prog().respuestas;
  let total = 0, hechas = 0;
  ej.partes.forEach((pt) => pt.preguntas.forEach((q) => {
    if (q.opcional) return;
    q.subs.forEach((_, j) => { total++; if ((r[`${q.n}.${j}`] || '').trim()) hechas++; });
  }));
  return { total, hechas };
}

/* ── Render ── */
function renderHilo(ej, todas) {
  const p = prog();
  const items = ej.etapas.map((e, i) => {
    const suyas = todas.map((x, k) => ({ ...x, k })).filter((x) => x.etapa === i);
    const primera = suyas[0].k;
    const bloqueada = primera > p.alcanzada;
    const actual = p.pos !== PREGUNTAS && todas[p.pos].etapa === i;
    const clase = actual ? 'actual' : suyas.every((x) => x.k <= p.alcanzada) ? 'hecha' : '';
    const puntos = suyas.map((x) => `<i class="${x.k === p.pos ? 'aca' : x.k <= p.alcanzada ? 'visto' : ''}"></i>`).join('');
    return `<li class="${clase}"><button type="button" data-ir="${primera}" ${bloqueada ? 'disabled' : ''} ${actual ? 'aria-current="step"' : ''}><span class="pp-barra"></span><span class="pp-nombre">${bloqueada ? '🔒 ' : ''}${i + 1}. ${e.nombre}</span><span class="pp-puntos">${puntos}</span></button></li>`;
  });
  const { total, hechas } = contar(ej);
  items.push(`<li class="siempre ${p.pos === PREGUNTAS ? 'actual' : ''}"><button type="button" data-ir="${PREGUNTAS}"><span class="pp-barra"></span><span class="pp-nombre">✎ Preguntas · ${hechas}/${total}</span><span class="pp-puntos">siempre abierta</span></button></li>`);
  document.getElementById('hilo').innerHTML = items.join('');
}

function renderPantalla(ej, todas) {
  const p = prog();
  const x = todas[p.pos], ant = todas[p.pos - 1], sig = todas[p.pos + 1];
  const etapa = ej.etapas[x.etapa];
  const puntos = todas.filter((y) => y.etapa === x.etapa).map((y) => `<i class="${y.j === x.j ? 'aca' : 'visto'}"></i>`).join('');
  const largo = !sig ? 'Ir a las preguntas' : sig.etapa !== x.etapa ? `Siguiente etapa: ${ej.etapas[sig.etapa].nombre}` : `Siguiente: ${esc(sig.titulo)}`;
  const etiquetaSig = `<span class="pp-largo">${largo}</span><span class="pp-corto">${sig ? 'Siguiente' : 'Preguntas'}</span>`;
  return `
    <div class="pp-marco-cabecera"><span class="pp-sobre">Etapa ${x.etapa + 1} · ${etapa.nombre} · ${esc(x.titulo)}</span><span class="pp-puntos">${puntos}<span>${x.j + 1} de ${x.de}</span></span></div>
    <div class="pp-cuerpo">${x.html}</div>
    <div class="pp-pie">
      <div>${ant ? `<button type="button" class="pp-enlace" data-ir="${p.pos - 1}">← <span class="pp-largo">Anterior: ${esc(ant.titulo)}</span><span class="pp-corto">Anterior</span></button>` : ''}</div>
      <button type="button" class="boton" data-siguiente>${etiquetaSig} →</button>
    </div>`;
}

function renderPreguntas(ej) {
  const p = prog();
  const { total, hechas } = contar(ej);
  const lista = ej.partes.map((pt) => `<h3 class="pp-parte">${esc(pt.nombre)}</h3>` + pt.preguntas.map((q) => {
    const listas = q.subs.filter((_, j) => (p.respuestas[`${q.n}.${j}`] || '').trim()).length;
    const subs = q.subs.map((texto, j) => {
      const id = `resp-${estado.ej}-${q.n}-${j}`;
      const valor = p.respuestas[`${q.n}.${j}`] || '';
      return `<div class="pp-sub ${valor.trim() ? 'lista' : ''}"><label for="${id}"><span class="pp-sub-n">${q.n}.${j + 1}</span>${texto}</label><textarea id="${id}" class="editor-respuestas" data-respuesta="${q.n}.${j}" placeholder="${esc(ej.placeholder || 'Con evidencia del log')}">${esc(valor)}</textarea></div>`;
    }).join('');
    return `<div class="pp-pregunta ${listas === q.subs.length ? 'completa' : ''}" data-subs="${q.subs.length}">
      <div class="pp-pregunta-cabecera"><span class="pp-n">${q.n}.</span><span><span class="pp-pregunta-titulo">${q.titulo}</span>${q.opcional ? '<span class="pp-opcional">opcional</span>' : ''}${q.intro && q.subs.length > 1 ? `<div class="pp-intro">${q.intro}</div>` : ''}${q.pista ? `<div class="pp-pista">${q.pista.replace(/^Pista:\s*/, '')}</div>` : ''}</span><span class="pp-avance">${listas}/${q.subs.length}</span></div>
      <div class="pp-subs">${subs}</div>
    </div>`;
  }).join('')).join('');
  return `
    <div class="pp-marco-cabecera de-preguntas">
      <div class="pp-fila"><h2>Preguntas</h2><span class="pp-contador" style="font-size:.85rem;color:var(--texto-suave)">${hechas} de ${total} respondidas</span></div>
      <div class="pp-progreso"><div style="width:${(hechas / total) * 100}%"></div></div>
    </div>
    <div class="pp-cuerpo">${lista}</div>
    <div class="pp-pie">
      <div><button type="button" class="pp-enlace" data-ir="${p.ultima}">← Volver a la consigna</button></div>
      <button type="button" class="boton" data-guardar>Guardar respuestas</button>
    </div>`;
}

function render() {
  const ej = DATOS[estado.ej];
  const p = prog();
  const todas = pantallas(ej);
  if (p.pos !== PREGUNTAS && p.pos >= todas.length) p.pos = 0;
  document.getElementById('selector').innerHTML = IDS.map((id) => `<button type="button" data-ej="${id}" aria-pressed="${id === estado.ej}">Ejercicio ${DATOS[id].numero}</button>`).join('');
  document.getElementById('titulo').textContent = `Ejercicio ${ej.numero} · ${ej.titulo}`;
  document.getElementById('reloj').textContent = `${ej.minutos}:00`;
  document.getElementById('charla').innerHTML = ej.charla;
  renderHilo(ej, todas);
  document.getElementById('marco').innerHTML = p.pos === PREGUNTAS ? renderPreguntas(ej) : renderPantalla(ej, todas);
}

/* ── Navegación ── */
function ir(destino) {
  const p = prog();
  const total = pantallas(DATOS[estado.ej]).length;
  if (destino === PREGUNTAS || destino >= total) { if (p.pos !== PREGUNTAS) p.ultima = p.pos; p.pos = PREGUNTAS; }
  else if (destino >= 0 && destino <= p.alcanzada) p.pos = destino;
  persistir(); render();
}
function siguiente() {
  const p = prog();
  if (p.pos === PREGUNTAS) return;
  p.alcanzada = Math.max(p.alcanzada, p.pos + 1);
  ir(p.pos + 1);
}

async function copiar(boton, texto, etiqueta) {
  try { await navigator.clipboard.writeText(texto); boton.textContent = '¡Copiado!'; }
  catch { boton.textContent = 'No se pudo copiar'; }
  setTimeout(() => { boton.textContent = etiqueta; }, 2000);
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.ej) { estado.ej = b.dataset.ej; render(); }
  else if (b.dataset.siguiente !== undefined) siguiente();
  else if (b.dataset.ir !== undefined) ir(b.dataset.ir === PREGUNTAS ? PREGUNTAS : Number(b.dataset.ir));
  else if (b.dataset.copiar !== undefined) copiar(b, b.nextElementSibling?.textContent ?? '', b.textContent);
  else if (b.dataset.simular) {
    // Respuesta simulada: el visor real manda el pedido a la API.
    const r = JSON.parse(b.dataset.simular);
    b.closest('.pedido').querySelector('.pp-respuesta').innerHTML = `<div class="pedido-respuesta" role="status"><span class="pedido-estado" data-ok="${r.estado < 400}">${r.estado}</span><pre>${esc(JSON.stringify(r.cuerpo, null, 2))}</pre></div>`;
  }
  else if (b.dataset.guardar !== undefined) { persistir(); b.textContent = 'Guardado'; setTimeout(() => { b.textContent = 'Guardar respuestas'; }, 1500); }
});

// Flechas del teclado para pasar de pantalla, salvo mientras se escribe.
document.addEventListener('keydown', (e) => {
  if (e.target.closest('textarea, input') || e.altKey || e.metaKey || e.ctrlKey) return;
  const p = prog();
  if (e.key === 'ArrowRight') siguiente();
  else if (e.key === 'ArrowLeft' && p.pos !== PREGUNTAS && p.pos > 0) ir(p.pos - 1);
});

// Las respuestas se guardan al escribir; se actualizan los contadores sin redibujar los recuadros.
document.addEventListener('input', (e) => {
  const clave = e.target.dataset && e.target.dataset.respuesta;
  if (!clave) return;
  prog().respuestas[clave] = e.target.value;
  persistir();
  const ej = DATOS[estado.ej];
  const { total, hechas } = contar(ej);
  e.target.closest('.pp-sub').classList.toggle('lista', !!e.target.value.trim());
  const fila = e.target.closest('.pp-pregunta');
  const listas = fila.querySelectorAll('.pp-sub.lista').length;
  fila.querySelector('.pp-avance').textContent = `${listas}/${fila.dataset.subs}`;
  fila.classList.toggle('completa', listas === Number(fila.dataset.subs));
  document.querySelector('.pp-contador').textContent = `${hechas} de ${total} respondidas`;
  document.querySelector('.pp-progreso div').style.width = `${(hechas / total) * 100}%`;
  renderHilo(ej, pantallas(ej));
});

render();
</script>
</html>
