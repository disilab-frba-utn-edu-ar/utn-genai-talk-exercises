<style>
/* Mentorías a Voluntad — estilos globales.
   CSS plano con variables (Principio VI). Sistema de diseño "Viñeta": cómic minimalista
   sobre la base papel + tinta + naranja de la charla. Trazo de tinta grueso, sombras duras
   desplazadas (sin difuminado), trama de puntos, colores "de sticker" solo como fondo de
   texto en tinta, Bricolage Grotesque para títulos, IBM Plex Sans para el resto y Caveat
   para anotaciones a mano. Solo tema claro. */

:root {
  --fondo: #fbf6ea; /* papel */
  --superficie: #fffdf7;
  --texto: #17140f; /* tinta */
  --texto-suave: #4f4a42;
  --linea: #17140f;
  --linea-suave: color-mix(in srgb, #17140f 16%, transparent);
  --grilla: color-mix(in srgb, #17140f 6%, transparent);
  --trama: color-mix(in srgb, #17140f 13%, transparent);
  --acento: #e8482b;
  /* El acento puro no llega a 4.5:1 sobre papel: para texto chico se oscurece. */
  --acento-texto: #c2361b;
  --acento-suave: color-mix(in srgb, #e8482b 12%, transparent);
  --invertido: #fbf6ea; /* texto sobre tinta */
  /* Colores "de sticker": solo como fondo, siempre con texto en tinta (contraste > 10:1). */
  --resaltador: #ffd84d;
  --cielo: #9fd8ff;
  --menta: #a6e8c9;
  --rosa: #ffb3c7;
  --error: #b42318;
  --error-suave: color-mix(in srgb, #b42318 10%, transparent);

  --radio: 16px;
  --radio-chico: 10px;
  --borde: 2.5px solid var(--linea);
  /* Sombra de cómic: dura y desplazada, nunca difuminada. */
  --sombra: 5px 5px 0 var(--linea);
  --sombra-chica: 3px 3px 0 var(--linea);
  --sombra-alzada: 8px 8px 0 var(--linea);
  --trama-tam: 18px;

  --fuente: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fuente-titulos: "Bricolage Grotesque", var(--fuente);
  --fuente-mano: "Caveat", "Segoe Print", cursive;
  --fuente-codigo: "IBM Plex Mono", ui-monospace, monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);

  /* Layout a todo el ancho: margen lateral fluido, tope suave y medidas de lectura. */
  --gutter: clamp(0.75rem, 2.5vw, 2rem);
  --ancho-maximo: 120rem;
  --ancho-lectura: 64rem;
  --ancho-formulario: 56rem;
  --espacio-seccion: clamp(1.25rem, 3vw, 2rem);

  color-scheme: light;
}


*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  background-color: var(--fondo);
  /* Trama de puntos, como la impresión de una historieta. */
  background-image: radial-gradient(var(--trama) 1.2px, transparent 1.4px);
  background-size: var(--trama-tam) var(--trama-tam);
  background-attachment: fixed;
  color: var(--texto);
  font-family: var(--fuente);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1,
h2 {
  font-family: var(--fuente-titulos);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin: 0;
  text-wrap: balance;
}

h1 {
  font-size: clamp(2.1rem, 5.5vw, 3.6rem);
  letter-spacing: -0.025em;
}

a {
  color: var(--texto);
  text-decoration-color: var(--acento);
  text-underline-offset: 0.2em;
}

code {
  font-family: var(--fuente-codigo);
  font-size: 0.92em;
}

::selection {
  background: var(--acento);
  color: var(--invertido);
}

:focus-visible {
  outline: 3px solid var(--acento);
  outline-offset: 3px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.acento {
  color: var(--acento-texto);
}

/* En los títulos, la palabra destacada lleva un trazo de resaltador debajo. */
h1 .acento {
  padding-inline: 0.05em;
  background: linear-gradient(transparent 62%, var(--resaltador) 62% 92%, transparent 92%);
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

/* Anotación a mano: notas al margen, nunca texto principal. */
.nota-mano {
  font-family: var(--fuente-mano);
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.1;
  color: var(--acento-texto);
}

/* ── Estructura ─────────────────────────────────────────── */

.pagina {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.saltar {
  position: absolute;
  left: 1rem;
  top: -3rem;
  z-index: 1;
  padding: 0.5rem 1rem;
  background: var(--texto);
  color: var(--invertido);
  border-radius: var(--radio-chico);
}

.saltar:focus {
  top: 1rem;
}

.encabezado,
.contenido,
.pie {
  width: 100%;
  margin: 0;
  /* De borde a borde; el contenido se detiene en --ancho-maximo y se centra. */
  padding-inline: max(var(--gutter), calc((100% - var(--ancho-maximo)) / 2));
}

.encabezado {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 0.5rem 1.5rem;
  padding-block: 0.75rem;
  border-bottom: var(--borde);
}

.marca {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-family: var(--fuente-titulos);
  font-weight: 800;
  font-size: 1.2rem;
  letter-spacing: 0.01em;
  color: var(--texto);
  text-decoration: none;
}

.marca em {
  font-style: normal;
  color: var(--acento-texto);
}

.marcas {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.marca-utn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--texto);
  font-size: 0.95rem;
  text-decoration: none;
}

.marca-utn-logo {
  height: 2rem;
  width: auto;
}

.marca-utn strong {
  font-weight: 700;
}

.marcas-separador {
  width: 2px;
  height: 1.75rem;
  background: var(--linea-suave);
}

.marca-icono {
  display: grid;
  place-items: center;
  width: 2.1rem;
  height: 2.1rem;
  border: var(--borde);
  border-radius: var(--radio-chico);
  background: var(--acento);
  color: var(--invertido);
  box-shadow: var(--sombra-chica);
  transform: rotate(-4deg);
  font-family: var(--fuente-codigo);
  font-size: 1.1rem;
  line-height: 1;
}

.navegacion {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 1.25rem;
  font-size: 0.95rem;
  font-weight: 600;
}

.navegacion a {
  padding: 0.2rem 0.15rem;
  color: var(--texto-suave);
  text-decoration: none;
  transition: background-size 0.2s var(--ease), color 0.2s var(--ease);
  /* Resaltador que crece de 0 al ancho completo en la página actual. */
  background: linear-gradient(var(--resaltador), var(--resaltador)) no-repeat left 85% / 0% 40%;
}

.navegacion a:hover {
  color: var(--texto);
  background-size: 100% 40%;
}

.navegacion a[aria-current="page"] {
  color: var(--texto);
  background-size: 100% 40%;
}

.encabezado-lema {
  margin: 0;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--texto-suave);
}

.contenido {
  flex: 1;
  padding-block: var(--espacio-seccion) 2.5rem;
}

.pie {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.5rem 1rem;
  padding-block: 0.75rem 1rem;
  border-top: var(--borde);
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--texto-suave);
}

.pie strong {
  color: var(--texto);
  font-weight: 600;
}

/* ── Textos ─────────────────────────────────────────────── */

/* Recuadro de narración de historieta: amarillo, con trazo y apenas inclinado. */
.sobretitulo {
  display: inline-block;
  margin: 0 0 0.9rem;
  padding: 0.15rem 0.65rem;
  border: 2px solid var(--linea);
  background: var(--resaltador);
  box-shadow: var(--sombra-chica);
  color: var(--texto);
  font-family: var(--fuente-codigo);
  font-size: 0.85rem;
  font-weight: 500;
  transform: rotate(-1.5deg);
}

.sobretitulo::before {
  content: "// ";
}

/* Cursor de terminal, como los prompts de la charla. */
.prompt::after {
  content: "▋";
  margin-left: 0.15em;
  animation: parpadear 1.05s steps(1, end) infinite;
}

.bajada {
  max-width: 42rem;
  margin: 1rem 0 0;
  font-size: 1.125rem;
  color: var(--texto-suave);
}

.portada {
  margin-bottom: 1.75rem;
  padding-bottom: 1.5rem;
  border-bottom: 2px dashed var(--linea-suave);
}

.portada h1 {
  max-width: 18ch;
  font-size: clamp(2rem, 5vw, 3.6rem);
  line-height: 0.98;
}

/* Portada con ilustración al costado (inicio): en pantallas chicas la viñeta se oculta. */
.portada-con-vineta {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(16rem, 1fr);
  align-items: center;
  gap: 2rem 3rem;
}

.vineta {
  display: grid;
  gap: 1.25rem;
  padding: 1.5rem;
  border: var(--borde);
  border-radius: 22px;
  background: var(--cielo);
  box-shadow: var(--sombra);
}

/* Globo de diálogo: la colita es un cuadrado girado con el mismo trazo. */
.globo {
  position: relative;
  max-width: 17rem;
  margin: 0;
  padding: 0.75rem 1rem;
  border: var(--borde);
  border-radius: 18px;
  background: var(--superficie);
  font-size: 0.95rem;
  line-height: 1.4;
}

.globo::after {
  content: "";
  position: absolute;
  bottom: -0.6rem;
  left: 1.75rem;
  width: 1.1rem;
  height: 1.1rem;
  border-right: var(--borde);
  border-bottom: var(--borde);
  background: inherit;
  transform: rotate(45deg);
}

.globo-respuesta {
  justify-self: end;
  background: var(--resaltador);
}

.globo-respuesta::after {
  left: auto;
  right: 1.75rem;
}

.globo-quien {
  display: block;
  font-family: var(--fuente-mano);
  font-size: 1.3rem;
  font-weight: 700;
  line-height: 1;
}

@media (max-width: 56rem) {
  .portada-con-vineta {
    grid-template-columns: 1fr;
  }

  .vineta {
    display: none;
  }
}

/* ── Botones, chips y etiquetas ─────────────────────────── */

.boton {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 2.75rem;
  padding: 0.6rem 1.25rem;
  border: var(--borde);
  border-radius: 12px;
  background: var(--texto);
  color: var(--invertido);
  box-shadow: 3px 3px 0 var(--acento);
  font: inherit;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-decoration: none;
  cursor: pointer;
  transition:
    transform 0.12s var(--ease),
    box-shadow 0.12s var(--ease);
}

/* Se levanta al pasar el mouse y se hunde al hacer clic, como un botón físico. */
.boton:hover:not(:disabled) {
  transform: translate(-1px, -1px);
  box-shadow: 5px 5px 0 var(--acento);
}

.boton:active:not(:disabled) {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--acento);
}

.boton:disabled {
  opacity: 0.4;
  box-shadow: none;
  cursor: not-allowed;
}

.boton-secundario {
  background: var(--superficie);
  color: var(--texto);
  box-shadow: var(--sombra-chica);
}

.boton-secundario:hover:not(:disabled) {
  box-shadow: 5px 5px 0 var(--linea);
}

.boton-secundario:active:not(:disabled) {
  box-shadow: 0 0 0 var(--linea);
}

.boton-grande {
  width: 100%;
  min-height: 3.25rem;
  font-size: 1.0625rem;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
}

/* Stickers: píldora con trazo y sombra corta; el activo queda en tinta y apenas girado. */
.chip {
  min-height: 2.5rem;
  padding: 0.4rem 1rem;
  border: 2px solid var(--linea);
  border-radius: 999px;
  background: var(--superficie);
  color: var(--texto);
  box-shadow: 2px 2px 0 var(--linea);
  font: inherit;
  font-size: 0.9375rem;
  font-weight: 600;
  cursor: pointer;
  transition:
    transform 0.15s var(--ease),
    box-shadow 0.15s var(--ease),
    background 0.15s var(--ease);
}

.chip:hover {
  transform: translate(-1px, -1px);
  box-shadow: 3px 3px 0 var(--linea);
  background: color-mix(in srgb, var(--resaltador) 35%, var(--superficie));
}

.chip[aria-pressed="true"] {
  background: var(--texto);
  color: var(--invertido);
  transform: rotate(-2deg);
}

.etiquetas {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.etiqueta {
  padding: 0.1rem 0.55rem;
  border: 1.5px solid var(--linea);
  border-radius: 6px;
  background: var(--superficie);
  color: var(--texto);
  font-size: 0.8125rem;
  font-weight: 600;
}

/* ── Listado de mentoras ────────────────────────────────── */

.filtros {
  margin-bottom: 2rem;
}

.grilla {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr));
  /* Más aire que antes: las sombras desplazadas necesitan lugar. */
  gap: 1.6rem;
}

.tarjeta {
  border: var(--borde);
  border-radius: var(--radio);
  background: var(--superficie);
  box-shadow: var(--sombra);
}

.mentora {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding: 1.35rem;
  transition:
    transform 0.25s var(--ease),
    box-shadow 0.25s var(--ease);
}

.mentora:hover {
  transform: translate(-3px, -3px);
  box-shadow: var(--sombra-alzada);
}

.mentora-nombre {
  font-size: 1.75rem;
  transition: color 0.2s var(--ease);
}

.mentora:hover .mentora-nombre {
  color: var(--acento-texto);
}

.mentora-meta {
  margin: 0.15rem 0 0;
  min-height: 1.25rem;
  font-size: 0.875rem;
  color: var(--texto-suave);
}

.mentora-presentacion {
  flex: 1;
  margin: 0;
}

.mentora-accion {
  align-self: flex-start;
}

/* ── Reserva ────────────────────────────────────────────── */

.volver {
  display: inline-block;
  margin-bottom: 1.5rem;
  font-weight: 600;
  text-decoration: none;
}

.volver:hover {
  color: var(--acento-texto);
}

.reserva-cabecera {
  margin-bottom: 2.5rem;
}

.reserva-pagina {
  max-width: var(--ancho-formulario);
  margin-inline: auto;
}

.reserva {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.paso {
  padding: 1.35rem;
  border: var(--borde);
  border-radius: var(--radio);
  background: var(--superficie);
  box-shadow: var(--sombra);
  animation: aparecer 0.45s var(--ease);
}

.paso-titulo {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.1rem;
  font-size: 1.35rem;
}

.paso-numero {
  display: grid;
  place-items: center;
  flex: none;
  width: 2.2rem;
  height: 2.2rem;
  border: 2px solid var(--linea);
  border-radius: 50%;
  background: var(--resaltador);
  color: var(--texto);
  box-shadow: 2px 2px 0 var(--linea);
  font-family: var(--fuente-titulos);
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0;
}

.opciones-tipo {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr));
  gap: 0.75rem;
  margin: 0;
  padding: 0;
  border: 0;
}

.opcion-tipo {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.3rem 0.5rem;
  padding: 0.95rem 1rem;
  border: 2px solid var(--linea);
  border-radius: var(--radio-chico);
  background: var(--superficie);
  cursor: pointer;
  transition:
    transform 0.15s var(--ease),
    box-shadow 0.15s var(--ease),
    background 0.15s var(--ease);
}

.opcion-tipo:hover {
  transform: translate(-1px, -1px);
  box-shadow: var(--sombra-chica);
}

.opcion-tipo[data-activo="true"] {
  background: color-mix(in srgb, var(--resaltador) 45%, var(--superficie));
  box-shadow: var(--sombra-chica);
}

.opcion-tipo:has(input:focus-visible) {
  outline: 3px solid var(--acento);
  outline-offset: 3px;
}

.opcion-tipo input {
  position: absolute;
  opacity: 0;
}

.opcion-tipo-nombre {
  font-weight: 700;
}

.opcion-tipo-duracion {
  font-family: var(--fuente-codigo);
  font-size: 0.8125rem;
  color: var(--acento-texto);
}

.opcion-tipo-descripcion {
  grid-column: 1 / -1;
  font-size: 0.875rem;
  color: var(--texto-suave);
}

.dias {
  display: flex;
  gap: 0.5rem;
  overflow-x: auto;
  padding: 0.25rem 0.25rem 0.5rem;
  margin-inline: -0.25rem;
}

/* Centrado con márgenes auto (no justify-content): si los días desbordan y
   hay scroll horizontal, el primero no queda cortado a la izquierda. */
.dia:first-child {
  margin-left: auto;
}

.dia:last-child {
  margin-right: auto;
}

.horarios {
  justify-content: center;
}

.dia {
  display: flex;
  flex: none;
  flex-direction: column;
  align-items: center;
  width: 4.25rem;
  padding: 0.6rem 0;
  border: 2px solid var(--linea);
  border-radius: var(--radio-chico);
  background: var(--superficie);
  color: var(--texto);
  box-shadow: 2px 2px 0 var(--linea);
  font: inherit;
  cursor: pointer;
  transition:
    transform 0.15s var(--ease),
    background 0.15s var(--ease);
}

.dia:hover {
  transform: translate(-1px, -1px);
  background: color-mix(in srgb, var(--resaltador) 35%, var(--superficie));
}

.dia[aria-pressed="true"] {
  border-color: var(--texto);
  background: var(--texto);
  color: var(--invertido);
}

.dia-semana,
.dia-mes {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.dia-numero {
  font-family: var(--fuente-titulos);
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.dia[aria-pressed="true"] .dia-numero {
  color: var(--resaltador);
}

/* ── Formulario ─────────────────────────────────────────── */

.formulario {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.campos-fila {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr));
  gap: 0 1rem;
}

.campo {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.campo label {
  font-weight: 600;
  font-size: 0.9375rem;
}

.campo input,
.campo select,
.campo textarea {
  width: 100%;
  padding: 0.65rem 0.8rem;
  border: 2px solid var(--linea);
  border-radius: var(--radio-chico);
  background: var(--superficie);
  color: var(--texto);
  font: inherit;
  transition: box-shadow 0.15s var(--ease);
}

.campo input:focus,
.campo select:focus,
.campo textarea:focus {
  box-shadow: var(--sombra-chica);
}

.campo input:focus-visible,
.campo select:focus-visible,
.campo textarea:focus-visible {
  outline-offset: 1px;
}

.campo [aria-invalid="true"] {
  border-color: var(--error);
  border-width: 2px;
}

.campo-error {
  min-height: 1.25rem;
  margin: 0;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--error);
}

.aviso-error {
  margin: 0;
  padding: 0.85rem 1rem;
  border: 2.5px solid var(--error);
  border-radius: var(--radio-chico);
  background: var(--error-suave);
  box-shadow: 3px 3px 0 var(--error);
  color: var(--error);
  font-weight: 600;
}

/* ── Estados ────────────────────────────────────────────── */

.estado {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
  padding: 2.5rem 1rem;
  text-align: center;
  color: var(--texto-suave);
}

.estado p {
  margin: 0;
}

.estado-titulo {
  font-family: var(--fuente-titulos);
  font-weight: 800;
  font-size: 1.35rem;
  letter-spacing: -0.02em;
  color: var(--texto);
}

.estado-error {
  color: var(--error);
}

.spinner {
  width: 1.75rem;
  height: 1.75rem;
  border: 3px solid var(--linea-suave);
  border-top-color: var(--linea);
  border-radius: 50%;
  animation: girar 0.8s linear infinite;
}

.no-encontrada h1 {
  color: var(--texto);
}

/* ── Confirmación ───────────────────────────────────────── */

.confirmacion {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  max-width: 38rem;
  margin: 0 auto;
  text-align: center;
}

.confirmacion .bajada {
  margin-top: 0;
}

.confirmacion-icono {
  display: grid;
  place-items: center;
  width: 4rem;
  height: 4rem;
  border: var(--borde);
  border-radius: 50%;
  background: var(--menta);
  color: var(--texto);
  box-shadow: var(--sombra);
  font-size: 2rem;
  font-weight: 800;
  transform: rotate(-6deg);
  animation: aparecer 0.5s var(--ease);
}

.resumen {
  width: 100%;
  margin: 0.5rem 0 0;
  padding: 0.35rem 1.35rem;
  text-align: left;
}

.resumen-fila {
  display: grid;
  grid-template-columns: 7rem 1fr;
  gap: 1rem;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--linea-suave);
}

.resumen-fila:last-child {
  border-bottom: 0;
}

.resumen dt {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--texto-suave);
  padding-top: 0.15rem;
}

.resumen dd {
  margin: 0;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.confirmacion-id {
  margin: 0;
  font-size: 0.8125rem;
  color: var(--texto-suave);
  overflow-wrap: anywhere;
}

.confirmacion-id code {
  color: var(--texto);
}

/* ── Animaciones ────────────────────────────────────────── */

@keyframes girar {
  to {
    transform: rotate(360deg);
  }
}

@keyframes aparecer {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}

@keyframes parpadear {
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}

@media (max-width: 80rem) {
  .encabezado-lema {
    display: none;
  }
}

/* Encabezado: una fila desde 64rem; en pantallas chicas las zonas se apilan. */
@media (max-width: 64rem) {
  .encabezado {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 30rem) {
  .encabezado-lema {
    display: none;
  }

  .marca-utn-texto,
  .marcas-separador {
    display: none;
  }

  .resumen-fila {
    grid-template-columns: 1fr;
    gap: 0.1rem;
  }
}

/* Visor de ejercicios: solo lo que no está en client/src/styles.css (usa sus variables). */

/* Medida de lectura: --ancho-lectura (client/src/styles.css). */
.ejercicio-cabecera,
.ejercicio-pagina .paso {
  width: 100%;
  max-width: var(--ancho-lectura);
  margin-inline: auto;
}

.ejercicio-cabecera {
  margin-bottom: 1.5rem;
}

.ejercicio-cabecera .chip {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
}

.paso {
  scroll-margin-top: 1rem;
}

.documento {
  margin-top: var(--espacio-seccion);
  padding: 1.35rem;
}

/* ── Video de introducción ──────────────────────────────── */

/* Una viñeta que se abre sobre la página: recuadro de narración, título, la "pantalla" con sombra
   de acento como los botones, y abajo la nota a mano y la acción para seguir. */
.video-intro {
  width: min(52rem, calc(100% - 2rem));
  max-height: calc(100% - 2rem);
  padding: 0;
  border: var(--borde);
  border-radius: var(--radio);
  background: var(--superficie);
  color: var(--texto);
  box-shadow: var(--sombra-alzada);
}

.video-intro[open] {
  animation: video-intro-entrar 0.4s var(--ease);
}

@keyframes video-intro-entrar {
  from {
    opacity: 0;
    transform: translateY(1rem) scale(0.96) rotate(-1deg);
  }
}

/* Tinta con trama de puntos, como la impresión de una historieta. */
.video-intro::backdrop {
  background-color: color-mix(in srgb, var(--texto) 55%, transparent);
  background-image: radial-gradient(color-mix(in srgb, var(--fondo) 22%, transparent) 1.2px, transparent 1.5px);
  background-size: 14px 14px;
}

.video-intro-caja {
  padding: 1.25rem 1.5rem 1.4rem;
}

.video-intro-cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.1rem;
}

.video-intro-cabecera .sobretitulo {
  margin-bottom: 0.55rem;
}

.video-intro-titulo {
  margin: 0;
  font-family: var(--fuente-titulos);
  font-size: clamp(1.3rem, 3vw, 1.75rem);
  font-weight: 800;
  line-height: 1.1;
}

.video-intro-minimizar {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 2.75rem;
  height: 2.75rem;
  border: var(--borde);
  border-radius: 12px;
  background: var(--superficie);
  color: var(--texto);
  box-shadow: var(--sombra-chica);
  cursor: pointer;
  transition:
    transform 0.12s var(--ease),
    box-shadow 0.12s var(--ease),
    background-color 0.12s;
}

.video-intro-minimizar svg {
  width: 1.3rem;
  height: 1.3rem;
}

.video-intro-minimizar:hover {
  background: var(--resaltador);
  transform: translate(-1px, -1px);
  box-shadow: var(--sombra);
}

.video-intro-minimizar:active {
  transform: translate(3px, 3px);
  box-shadow: none;
}

.video-intro-pantalla {
  overflow: hidden;
  border: var(--borde);
  border-radius: 12px;
  background: var(--texto);
  box-shadow: 6px 6px 0 var(--acento);
}

.video-intro-pantalla video {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
}

.video-intro-descripcion {
  max-width: 62ch;
  margin: 1.1rem 0 0;
  color: var(--texto-suave);
  font-size: 0.9375rem;
}

.video-intro-pie {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem 1.25rem;
  margin-top: 1.1rem;
  padding-top: 1rem;
  border-top: 2px dashed var(--linea-suave);
}

.video-intro-nota {
  margin: 0;
  font-size: 1.35rem;
  transform: rotate(-1.5deg);
}

/* Minimizado: un sticker abajo a la derecha, apenas torcido; se endereza al pasar el mouse. */
.video-intro-mini {
  position: fixed;
  right: 1rem;
  bottom: 1rem;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 0.7rem;
  padding: 0.4rem 0.9rem 0.4rem 0.4rem;
  border: var(--borde);
  border-radius: 14px;
  background: var(--superficie);
  color: var(--texto);
  box-shadow: var(--sombra);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transform: rotate(-1.5deg);
  animation: video-intro-mini-entrar 0.45s var(--ease);
  transition:
    transform 0.15s var(--ease),
    box-shadow 0.15s var(--ease),
    background-color 0.15s;
}

@keyframes video-intro-mini-entrar {
  from {
    opacity: 0;
    transform: translateY(1.5rem) rotate(4deg);
  }
}

.video-intro-mini:hover {
  background: var(--resaltador);
  transform: translate(-2px, -2px);
  box-shadow: var(--sombra-alzada);
}

.video-intro-mini:active {
  transform: translate(2px, 2px);
  box-shadow: var(--sombra-chica);
}

.video-intro-mini:focus-visible {
  outline: 3px solid var(--acento);
  outline-offset: 3px;
}

/* La miniatura con un botón de play encima: círculo de acento y triángulo de papel. */
.video-intro-mini-miniatura {
  position: relative;
  flex-shrink: 0;
  width: 5rem;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border: 2px solid var(--linea);
  border-radius: 8px;
}

.video-intro-mini-miniatura img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.video-intro-mini-miniatura::before,
.video-intro-mini-miniatura::after {
  content: "";
  position: absolute;
  inset: 0;
  margin: auto;
}

.video-intro-mini-miniatura::before {
  width: 1.6rem;
  height: 1.6rem;
  border: 2px solid var(--linea);
  border-radius: 999px;
  background: var(--acento);
}

.video-intro-mini-miniatura::after {
  width: 0;
  height: 0;
  translate: 1.5px 0;
  border-block: 0.32rem solid transparent;
  border-left: 0.5rem solid var(--superficie);
}

.video-intro-mini-texto {
  display: grid;
  gap: 0.1rem;
  line-height: 1.2;
}

.video-intro-mini-texto > :first-child {
  font-size: 0.875rem;
  font-weight: 700;
}

.video-intro-mini-duracion {
  color: var(--texto-suave);
  font-family: var(--fuente-codigo);
  font-size: 0.75rem;
}

@media (max-width: 30rem) {
  .video-intro-caja {
    padding: 1rem;
  }

  .video-intro-pie .boton {
    width: 100%;
  }

  /* En el celular, solo la miniatura: el texto queda para el lector de pantalla. */
  .video-intro-mini {
    padding: 0.35rem;
  }

  .video-intro-mini-texto {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
}

/* ── Candado: cada ejercicio se habilita al terminar el anterior ── */

.candado {
  width: 1.15em;
  height: 1.15em;
  flex-shrink: 0;
}

/* La tarjeta bloqueada queda "tachada" con una trama y sin levantarse al pasar el mouse. */
.mentora[data-bloqueado] {
  position: relative;
  background-image: repeating-linear-gradient(-45deg, var(--trama) 0 1.5px, transparent 1.5px 10px);
  box-shadow: var(--sombra-chica);
}

.mentora[data-bloqueado]:hover {
  transform: none;
  box-shadow: var(--sombra-chica);
}

.mentora[data-bloqueado]:hover .mentora-nombre {
  color: inherit;
}

.mentora[data-bloqueado] > :not(.tarjeta-aviso, dialog) {
  opacity: 0.68;
}

/* El candado como sticker sobre la esquina de la tarjeta. */
.tarjeta-candado,
.bloqueado-candado {
  display: grid;
  place-items: center;
  border: var(--borde);
  border-radius: 999px;
  background: var(--resaltador);
  box-shadow: var(--sombra-chica);
  transform: rotate(8deg);
}

/* Va dentro del botón del aviso, pero se ubica contra la tarjeta (el botón no está posicionado). */
.tarjeta-candado {
  position: absolute;
  top: -1rem;
  right: -0.75rem;
  z-index: 2;
  width: 3rem;
  height: 3rem;
  font-size: 1.35rem;
}

.tarjeta-aviso {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin: 0;
  padding: 0.5rem 0.85rem;
  border: 2px dashed var(--linea);
  border-radius: 12px;
  background: var(--superficie);
  color: var(--texto);
  font: inherit;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 0.15s;
}

/* El botón se estira sobre toda la tarjeta: tocar el candado (o cualquier parte) pregunta si avanzar igual. */
.tarjeta-aviso::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  border-radius: var(--radio);
}

.mentora[data-bloqueado]:hover .tarjeta-aviso,
.tarjeta-aviso:focus-visible {
  background: var(--resaltador);
}

.tarjeta-aviso:focus-visible {
  outline: 3px solid var(--acento);
  outline-offset: 3px;
}

/* El candado se sacude un poco al pasar el mouse, como invitando a tocarlo. */
.mentora[data-bloqueado]:hover .tarjeta-candado {
  transform: rotate(-8deg) scale(1.08);
}

.tarjeta-candado {
  transition: transform 0.2s var(--ease);
}

/* La pregunta para avanzar igual: el detalle del tablero, más angosto y con el candado de sticker. */
.confirmar {
  width: min(32rem, calc(100% - 2rem));
  overflow: visible;
}

.confirmar .detalle-caja {
  position: relative;
  display: grid;
  gap: 0.75rem;
}

.confirmar h2 {
  margin: 0;
  padding-right: 3.5rem;
  font-family: var(--fuente-titulos);
  font-size: 1.35rem;
  font-weight: 800;
  line-height: 1.15;
}

.confirmar p {
  margin: 0;
  color: var(--texto-suave);
}

.confirmar-acciones {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem;
  margin-top: 0.25rem;
}

.bloqueado {
  position: relative;
}

.bloqueado-candado {
  position: absolute;
  top: -1.1rem;
  right: 1.25rem;
  width: 3.5rem;
  height: 3.5rem;
  font-size: 1.6rem;
}

/* ── Markdown de las consignas ──────────────────────────── */

/* break-word (no anywhere): las tablas hacen scroll en vez de partir palabras. */
.markdown {
  overflow-wrap: break-word;
}

.markdown > :first-child {
  margin-top: 0;
}

.markdown h1,
.markdown h2,
.markdown h3,
.markdown h4 {
  margin: 2rem 0 0.75rem;
  font-family: var(--fuente-titulos);
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.markdown h1 {
  font-size: clamp(1.6rem, 4vw, 2.2rem);
}

.markdown h2 {
  padding-top: 1.25rem;
  border-top: 2px dashed var(--linea-suave);
  font-size: 1.45rem;
}

.markdown h3 {
  font-size: 1.15rem;
}

.markdown h4 {
  font-size: 1rem;
}

/* Las citas son el recuadro de narración de la consigna: amarillo, con trazo y sombra corta. */
.markdown blockquote {
  margin: 1.25rem 0;
  padding: 0.5rem 1rem;
  border: 2px solid var(--linea);
  border-radius: var(--radio-chico);
  background: color-mix(in srgb, var(--resaltador) 40%, var(--superficie));
  box-shadow: var(--sombra-chica);
}

.markdown blockquote p {
  margin: 0.4rem 0;
}

.markdown :not(pre) > code {
  padding: 0.1em 0.35em;
  border-radius: 4px;
  background: var(--superficie);
  border: 1.5px solid var(--linea);
}

.markdown table {
  display: block;
  overflow-x: auto;
  border-collapse: collapse;
  margin: 1rem 0;
  font-size: 0.9375rem;
}

.markdown th,
.markdown td {
  padding: 0.5rem 0.75rem;
  border: 1.5px solid var(--linea);
  text-align: left;
  vertical-align: top;
}

.markdown th {
  background: var(--cielo);
}

.markdown li {
  margin-block: 0.25rem;
}

.markdown li:has(> input[type="checkbox"]) {
  list-style: none;
}

.markdown details {
  margin: 0.75rem 0;
  padding: 0.6rem 1rem;
  border: 2px solid var(--linea);
  border-radius: var(--radio-chico);
  background: var(--superficie);
  box-shadow: 2px 2px 0 var(--linea);
}

.markdown summary {
  cursor: pointer;
}

.markdown hr {
  margin: 2rem 0;
  border: 0;
  border-top: 2px dashed var(--linea-suave);
}

.enlace-repo {
  border-bottom: 1px dashed var(--texto-suave);
}

/* Bloques de código con botón de copiar (estética terminal). */
.codigo {
  position: relative;
  margin: 1rem 0;
}

.codigo pre {
  margin: 0;
  padding: 2.6rem 1rem 1rem;
  overflow-x: auto;
  border: var(--borde);
  border-radius: var(--radio-chico);
  box-shadow: 3px 3px 0 var(--acento);
  background: var(--texto);
  color: var(--invertido);
  font-size: 0.875rem;
  line-height: 1.5;
}

.boton-copiar {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  padding: 0.25rem 0.7rem;
  border: 1.5px solid var(--invertido);
  border-radius: var(--radio-chico);
  background: transparent;
  color: var(--invertido);
  font: inherit;
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
}

.boton-copiar:hover {
  border-color: var(--resaltador);
  background: var(--resaltador);
  color: var(--texto);
}

/* El prompt (u otro anexo) dentro de la consigna, justo donde se lo nombra. */
.anexo-en-linea {
  margin: 0.75rem 0 1.25rem;
  padding: 1rem 1.15rem;
  border: var(--borde);
  border-radius: var(--radio);
  background: var(--superficie);
  box-shadow: 4px 4px 0 var(--acento);
}

.anexo-en-linea .markdown h1 {
  font-size: 1.15rem;
}

/* ── Respuestas ─────────────────────────────────────────── */

/* Cada pregunta en un desplegable, con su recuadro de respuesta adentro. */
.respuestas .markdown h3 {
  margin-top: 1.75rem;
}

.pregunta {
  margin: 0.75rem 0;
  border: 2px solid var(--linea);
  border-radius: var(--radio-chico);
  background: var(--superficie);
  box-shadow: var(--sombra-chica);
}

.pregunta summary {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.75rem 1rem;
  cursor: pointer;
  font-weight: 600;
}

.pregunta[open] summary {
  border-bottom: 2px dashed var(--linea-suave);
}

.pregunta-cuerpo {
  padding: 0.75rem 1rem 1rem;
}

.pregunta .editor-respuestas {
  min-height: 10rem;
  margin-top: 0.5rem;
}

.editor-respuestas {
  width: 100%;
  min-height: 8rem;
  padding: 1rem;
  border: none;
  border-radius: var(--radio-chico);
  background: var(--texto);
  color: var(--invertido);
  caret-color: var(--acento);
  font-family: var(--fuente-codigo);
  font-size: 0.875rem;
  line-height: 1.6;
  resize: vertical;
}

/* Las preguntas intercaladas entre los pasos: un recuadro que las separa de la consigna. */
.tramo-preguntas {
  margin: 1.5rem 0;
  padding: 0.25rem 1rem 0.75rem;
  border-left: 4px dashed var(--acento);
}

/* Un enlace de la consigna con forma de botón (por ejemplo, "Ver aplicación"). */
.boton-enlace {
  margin: 0.25rem 0;
}

/* Pegado abajo mientras se ven las preguntas: se puede guardar en cualquier momento. */
.respuestas-acciones {
  position: sticky;
  bottom: 0.75rem;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 1rem;
  margin-top: 0.75rem;
  padding: 0.6rem 0.75rem;
  border: var(--borde);
  border-radius: var(--radio);
  background: var(--superficie);
  box-shadow: var(--sombra-chica);
}

.respuestas-estado {
  margin: 0;
  font-size: 0.875rem;
  color: var(--texto-suave);
}

/* Sin nada que avisar no ocupa lugar. */
.respuestas-estado:empty {
  display: none;
}

/* En pantallas angostas los dos botones van en una fila ("Guardar" a secas; el lector de pantalla
   sigue leyendo "Guardar respuestas") y el aviso, si hay, abajo. */
@media (max-width: 40rem) {
  .respuestas-acciones .respuestas-estado {
    order: 1;
    flex-basis: 100%;
  }

  .respuestas-largo {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
}

/* Terminé, en la punta derecha de la barra: amarillo resaltador para que no pase de largo. */
.boton-terminar {
  margin-left: auto;
  background: var(--resaltador);
  color: var(--texto);
  box-shadow: 3px 3px 0 var(--linea);
}

.boton-terminar:hover:not(:disabled) {
  box-shadow: 5px 5px 0 var(--linea);
}

.boton-terminar:active:not(:disabled) {
  box-shadow: 0 0 0 var(--linea);
}

/* ── Temporizador ───────────────────────────────────────── */

/* Fijo arriba a la derecha mientras se scrollea la consigna. */
.temporizador {
  position: sticky;
  top: 0.75rem;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 0.75rem;
  width: fit-content;
  max-width: 100%;
  /* Alineado al borde derecho de la columna de lectura (--ancho-lectura). */
  margin: 0 max(0px, calc((100% - var(--ancho-lectura)) / 2)) 1.5rem auto;
  padding: 0.5rem 0.75rem;
  border: var(--borde);
  border-radius: var(--radio);
  background: var(--superficie);
  box-shadow: var(--sombra-chica);
}

.temporizador-etiqueta {
  font-size: 0.875rem;
  color: var(--texto-suave);
}

.temporizador-tiempo {
  font-family: var(--fuente-codigo);
  font-size: 1.25rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.temporizador[data-terminado="true"] {
  background: var(--resaltador);
}

.temporizador .boton {
  padding: 0.35rem 0.8rem;
  font-size: 0.875rem;
}

/* Diagramas que reemplazan bloques ASCII de las consignas (ver diagramas.ts). */
.diagrama {
  container-type: inline-size;
  margin: 1.25rem 0;
  padding: 1.25rem;
  border: var(--borde);
  border-radius: var(--radio);
  background: var(--superficie);
  box-shadow: var(--sombra);
}

/* El ciclo necesita aire arriba para el hook Stop. */
.ciclo {
  padding: 2rem 1.25rem 1rem;
}

.diagrama figcaption {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem 1.25rem;
  margin-top: 1.25rem;
  color: var(--texto-suave);
  font-size: 0.8125rem;
}

.diagrama figcaption > span {
  display: inline-flex;
  align-items: baseline;
  gap: 0.4rem;
}

/* Ciclo agéntico (ejercicio 1): actores en papel, hooks en tinta. */
.ciclo-mapa {
  display: grid;
  grid-template-columns: auto minmax(3.5rem, 1fr) auto minmax(1.5rem, 0.5fr) auto minmax(7rem, 1.4fr) auto;
  grid-template-rows: auto 2.75rem auto 3rem auto;
  grid-template-areas:
    ".   .       .   .      stop   .     .      "
    ".   .       .   .      fstop  .     .      "
    "vos fprompt ups fentra modelo fpide pre    "
    ".   .       .   .      fevid  .     fbaja  "
    ".   .       .   .      post   fizq  harness";
  align-items: center;
  justify-items: center;
  gap: 0.25rem;
  padding-bottom: 1rem;
}

.ciclo-mapa > * {
  position: relative;
  z-index: 1;
}

.ciclo-mapa > .ciclo-bucle {
  z-index: 0;
  grid-row: modelo-start / post-end;
  grid-column: modelo-start / pre-end;
  align-self: stretch;
  justify-self: stretch;
  margin: -0.75rem;
  border: 2px dashed var(--acento);
  border-radius: var(--radio);
  background: var(--acento-suave);
}

.ciclo-bucle > span {
  position: absolute;
  bottom: -0.75rem;
  left: 50%;
  transform: translateX(-50%);
  padding: 0 0.5rem;
  background: var(--superficie);
  color: var(--acento-texto);
  font: 600 0.75rem var(--fuente-codigo);
  white-space: nowrap;
}

.ciclo-actor {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0.45rem 0.85rem;
  border: var(--borde);
  border-radius: var(--radio-chico);
  background: var(--superficie);
  text-align: center;
}

.ciclo-nombre {
  font-family: var(--fuente-titulos);
  font-weight: 700;
}

.ciclo-detalle {
  color: var(--texto-suave);
  font-size: 0.75rem;
  white-space: nowrap;
}

.ciclo-hook {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0.35rem 0.75rem;
  border-radius: var(--radio-chico);
  background: var(--texto);
  color: var(--invertido);
  font: 600 0.8125rem var(--fuente-codigo);
  white-space: nowrap;
  animation: 7s ease-in-out infinite;
}

.ciclo-tag {
  font-size: 0.625rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.7;
}

.ciclo-tag::before {
  content: "◆ ";
  color: var(--acento);
}

/* Los hooks se encienden en el orden en que el harness los corre: el bucle da dos vueltas y termina. */
.ciclo-hook-ups { animation-name: ciclo-ups; }
.ciclo-hook-pre { animation-name: ciclo-pre; }
.ciclo-hook-post { animation-name: ciclo-post; }
.ciclo-hook-stop { animation-name: ciclo-stop; }

@keyframes ciclo-ups {
  0%, 15%, 100% { background: var(--texto); color: var(--invertido); }
  2%, 13% { background: var(--acento); color: var(--texto); }
}

@keyframes ciclo-pre {
  0%, 16%, 30%, 48%, 62%, 100% { background: var(--texto); color: var(--invertido); }
  18%, 28%, 50%, 60% { background: var(--acento); color: var(--texto); }
}

@keyframes ciclo-post {
  0%, 32%, 46%, 64%, 78%, 100% { background: var(--texto); color: var(--invertido); }
  34%, 44%, 66%, 76% { background: var(--acento); color: var(--texto); }
}

@keyframes ciclo-stop {
  0%, 80%, 96%, 100% { background: var(--texto); color: var(--invertido); }
  82%, 94% { background: var(--acento); color: var(--texto); }
}

.ciclo-flecha {
  color: var(--texto-suave);
  font: 0.75rem var(--fuente-codigo);
}

.ciclo-flecha::before,
.ciclo-flecha::after {
  content: "";
  position: absolute;
}

.ciclo-flecha::before {
  background: var(--linea);
}

.ciclo-flecha::after {
  width: 0;
  height: 0;
  border: 5px solid transparent;
}

.ciclo-der,
.ciclo-izq {
  justify-self: stretch;
  height: 1.5rem;
}

.ciclo-der::before,
.ciclo-izq::before {
  top: 50%;
  left: 0;
  right: 0;
  height: 2px;
  transform: translateY(-50%);
}

.ciclo-der::after {
  top: 50%;
  right: -1px;
  transform: translateY(-50%);
  border-left: 8px solid var(--linea);
  border-right-width: 0;
}

.ciclo-izq::after {
  top: 50%;
  left: -1px;
  transform: translateY(-50%);
  border-right: 8px solid var(--linea);
  border-left-width: 0;
}

.ciclo-der > span,
.ciclo-izq > span {
  position: absolute;
  bottom: 60%;
  left: 0;
  right: 0;
  text-align: center;
  white-space: nowrap;
}

.ciclo-arriba,
.ciclo-abajo {
  align-self: stretch;
  width: 0;
}

.ciclo-arriba::before,
.ciclo-abajo::before {
  top: 0;
  bottom: 0;
  left: 0;
  width: 2px;
  transform: translateX(-50%);
}

.ciclo-abajo::after {
  bottom: -1px;
  left: 0;
  transform: translateX(-50%);
  border-top: 8px solid var(--linea);
  border-bottom-width: 0;
}

.ciclo-arriba::after {
  top: -1px;
  left: 0;
  transform: translateX(-50%);
  border-bottom: 8px solid var(--linea);
  border-top-width: 0;
}

.ciclo-arriba > span,
.ciclo-abajo > span {
  position: absolute;
  top: 50%;
  left: 0.6rem;
  transform: translateY(-50%);
  white-space: nowrap;
}

.ciclo-solo-movil {
  display: none;
  font-style: normal;
}

.ciclo-muestra-hook,
.ciclo-muestra-actor {
  flex: none;
  width: 1.1rem;
  height: 0.75rem;
  border-radius: 3px;
}

.ciclo-muestra-hook {
  background: var(--texto);
}

.ciclo-muestra-actor {
  border: var(--borde);
  background: var(--superficie);
}

/* Angosto: el ciclo se lee de arriba hacia abajo y la vuelta al modelo se anota. */
@container (max-width: 44rem) {
  .ciclo-mapa {
    grid-template-columns: 1fr;
    grid-template-rows: none;
    grid-template-areas:
      "vos" "fprompt" "ups" "fentra" "modelo" "fpide" "pre" "fbaja"
      "harness" "fizq" "post" "fevid" "fstop" "stop";
  }

  .ciclo-mapa > .ciclo-bucle {
    grid-row: modelo-start / fevid-end;
    grid-column: 1 / -1;
  }

  .ciclo-mapa .ciclo-flecha {
    justify-self: center;
    align-self: stretch;
    width: 0;
    height: auto;
    min-height: 2rem;
  }

  .ciclo-mapa .ciclo-flecha::before {
    top: 0;
    bottom: 0;
    left: 0;
    right: auto;
    width: 2px;
    height: auto;
    transform: translateX(-50%);
  }

  .ciclo-mapa .ciclo-flecha::after {
    top: auto;
    bottom: -1px;
    left: 0;
    right: auto;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top: 8px solid var(--linea);
    border-bottom-width: 0;
  }

  .ciclo-mapa .ciclo-flecha > span {
    top: 50%;
    bottom: auto;
    left: 0.6rem;
    right: auto;
    transform: translateY(-50%);
    width: max-content;
    max-width: calc(50cqi - 1.5rem);
    white-space: normal;
    text-align: left;
  }

  .ciclo-mapa .ciclo-retorno {
    justify-self: stretch;
    width: auto;
    min-height: 0;
    padding: 0.4rem 0.75rem;
    text-align: center;
  }

  .ciclo-bucle > span {
    display: none;
  }

  .ciclo-mapa .ciclo-retorno::before,
  .ciclo-mapa .ciclo-retorno::after {
    display: none;
  }

  .ciclo-mapa .ciclo-retorno > span {
    position: static;
    transform: none;
    white-space: normal;
    color: var(--acento-texto);
    font-weight: 600;
  }

  .ciclo-solo-movil {
    display: inline;
  }
}

/* Pasos en fila (flujo SDD): tarjetas unidas por una línea, apiladas en angosto. */
.pasos {
  --pasos-hueco: 2.25rem;
  display: grid;
  grid-template-columns: repeat(var(--pasos-n), minmax(0, 1fr));
  gap: var(--pasos-hueco);
  margin: 0;
  padding: 0;
  list-style: none;
}

.pasos > li {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.15rem;
  margin: 0;
  padding: 0.55rem 0.35rem 0.6rem;
  border: var(--borde);
  border-radius: var(--radio-chico);
  background: var(--superficie);
  text-align: center;
}

.pasos > li:not(:last-child)::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 100%;
  width: calc(var(--pasos-hueco) + 4px);
  height: 2px;
  background: var(--linea);
}

.pasos-numero {
  color: var(--acento-texto);
  font: 600 0.6875rem var(--fuente-codigo);
}

.pasos-nombre {
  font: 700 0.8125rem var(--fuente-titulos);
}

.pasos-detalle {
  color: var(--texto-suave);
  font-size: 0.75rem;
  line-height: 1.25;
}

.pasos-control,
.pasos-control-muestra {
  display: inline-grid;
  place-items: center;
  width: 1.75rem;
  height: 1.75rem;
  border: var(--borde);
  border-radius: 50%;
  background: var(--acento);
  font-size: 0.8125rem;
  line-height: 1;
}

.pasos-control {
  position: absolute;
  z-index: 1;
  top: 50%;
  left: calc(100% + 2px + var(--pasos-hueco) / 2);
  transform: translate(-50%, -50%);
}

.pasos-control-muestra {
  width: 1.4rem;
  height: 1.4rem;
  align-self: center;
  font-size: 0.6875rem;
}

/* Validaciones entre etapas (desafío extra del ejercicio 3). */
.puertas {
  display: grid;
  gap: 0.6rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.puertas > li {
  display: grid;
  grid-template-columns: 6.5rem 2.25rem minmax(0, 1fr) auto;
  align-items: center;
  margin: 0;
}

.puertas > li::before {
  content: "→";
  grid-column: 2;
  grid-row: 1;
  color: var(--texto-suave);
  text-align: center;
}

.puerta-etapa {
  grid-column: 1;
  grid-row: 1;
  padding: 0.35rem 0.6rem;
  border-radius: var(--radio-chico);
  background: var(--texto);
  color: var(--invertido);
  font: 600 0.8125rem var(--fuente-codigo);
  text-align: center;
}

.puerta-pregunta {
  grid-column: 3;
  padding: 0.35rem 0.75rem;
  border: 2px dashed var(--linea);
  border-radius: var(--radio-chico);
  background: var(--superficie);
  font-weight: 600;
}

.puerta-barrera {
  grid-column: 4;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin-left: 0.85rem;
  color: var(--acento-texto);
  font: 600 0.75rem var(--fuente-codigo);
  white-space: nowrap;
}

.puerta-barrera::before {
  content: "";
  width: 1.9rem;
  height: 0.8rem;
  border-radius: 2px;
  background: repeating-linear-gradient(-45deg, var(--texto) 0 5px, var(--acento) 5px 10px);
}

/* Angosto: los pasos se apilan. */
@container (max-width: 48rem) {
  .pasos {
    grid-template-columns: minmax(0, 16rem);
    justify-content: center;
  }

  .pasos > li:not(:last-child)::after {
    top: 100%;
    left: 50%;
    width: 2px;
    height: calc(var(--pasos-hueco) + 4px);
  }

  .pasos-control {
    top: calc(100% + 2px + var(--pasos-hueco) / 2);
    left: 50%;
  }
}

/* Muy angosto: las puertas pasan a una columna. */
@container (max-width: 36rem) {
  .puertas > li {
    grid-template-columns: auto minmax(0, 1fr);
    gap: 0.4rem 0.5rem;
  }

  .puertas > li::before {
    display: none;
  }

  .puerta-pregunta {
    grid-column: 2;
  }

  .puerta-barrera {
    grid-column: 1 / -1;
    margin-left: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .ciclo-hook {
    animation: none;
  }
}

/* ── Ejercicio 3: bloqueo, Rocco, tablero ───────────────── */

/* El ejercicio 3 usa un ancho propio, más amplio que el de lectura: entra la consigna y, al costado, la tarea. */
.ejercicio-pagina {
  --ancho-sdd: calc(var(--ancho-lectura) + 30rem);
}

.bloqueado,
.po,
.sdd-pestanas,
.kanban-contenedor {
  width: 100%;
  max-width: var(--ancho-lectura);
  margin-inline: auto;
}

/* Ya en el tablero, cabecera, pestañas, temporizador, tablero y consigna se alinean al mismo ancho centrado. */
.ejercicio-pagina:has(.kanban-contenedor) .ejercicio-cabecera,
.sdd-pestanas,
.kanban-contenedor {
  max-width: var(--ancho-sdd);
}

/* El temporizador se alinea con --ancho-lectura: acá, con el ancho del ejercicio 3. */
.sdd-temporizador {
  display: contents;
  --ancho-lectura: var(--ancho-sdd);
}

.bloqueado {
  display: grid;
  justify-items: start;
  gap: 0.75rem;
  padding: 1.35rem;
}

.bloqueado h2,
.bloqueado p {
  margin: 0;
}

/* Rocco en una viñeta celeste, como la del inicio: el logo a la izquierda y su globo de diálogo. */
.po {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: clamp(1.5rem, 4vw, 3rem);
  padding: clamp(1.25rem, 3vw, 2rem);
  border: var(--borde);
  border-radius: 22px;
  background: var(--cielo);
  box-shadow: var(--sombra);
  perspective: 900px;
}

/* El logo de la marca en grande, apenas girado hacia el globo. */
.po-logo {
  display: grid;
  place-items: center;
  width: clamp(7rem, 18vw, 11rem);
  aspect-ratio: 1;
  border: var(--borde);
  border-radius: var(--radio);
  background: var(--texto);
  color: var(--acento);
  font-family: var(--fuente-codigo);
  font-size: clamp(4.5rem, 12vw, 7.5rem);
  line-height: 1;
  transform: rotateY(16deg) rotateX(4deg);
  box-shadow: 6px 6px 0 var(--acento);
}

/* Globo de diálogo: la colita es un cuadrado girado con el mismo trazo (como .globo). */
.po-dialogo {
  position: relative;
  padding: 1.1rem 1.35rem;
  border: var(--borde);
  border-radius: 18px;
  background: var(--superficie);
}

.po-dialogo::before {
  content: "";
  position: absolute;
  top: 50%;
  left: -0.7rem;
  width: 1.1rem;
  height: 1.1rem;
  border-left: var(--borde);
  border-bottom: var(--borde);
  background: inherit;
  transform: translateY(-50%) rotate(45deg);
}

.po-quien {
  margin: 0 0 0.35rem;
  font-family: var(--fuente-mano);
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1;
}

.po-quien span {
  margin-left: 0.35rem;
  font-family: var(--fuente-codigo);
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--texto-suave);
}

.po-texto {
  /* Reserva el alto del texto entero: el globo no salta mientras se escribe. */
  min-height: 7.5em;
  margin: 0;
  font-family: var(--fuente-codigo);
  font-size: 1.0625rem;
  font-weight: 700;
  line-height: 1.6;
}

/* El cursor de bloque, titilando mientras escribe (usa el parpadear de styles.css). */
.po-texto[data-escribiendo]::after {
  content: "▋";
  margin-left: 0.1em;
  color: var(--acento);
  animation: parpadear 1.05s steps(1, end) infinite;
}

.po-acciones {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 0.6rem;
  margin-top: 1.25rem;
}

.po-paso {
  margin-right: auto;
  font-family: var(--fuente-codigo);
  font-size: 0.8125rem;
  color: var(--texto-suave);
}

@media (max-width: 40rem) {
  .po {
    grid-template-columns: 1fr;
    justify-items: center;
  }

  .po-dialogo::before {
    top: -0.7rem;
    left: 50%;
    transform: translateX(-50%) rotate(135deg);
  }
}

.sdd-pestanas {
  margin-bottom: 1.25rem;
}

/* La ayuda del tablero, como anotación a mano. */
.kanban-ayuda {
  margin: 0 0 0.9rem;
  font-family: var(--fuente-mano);
  font-size: 1.4rem;
  font-weight: 700;
  line-height: 1.2;
}

.kanban-aviso {
  margin: 0 0 1rem;
  padding: 0.5rem 0.85rem;
  border: 2px solid var(--linea);
  border-radius: var(--radio-chico);
  background: color-mix(in srgb, var(--resaltador) 55%, var(--superficie));
  box-shadow: var(--sombra-chica);
  font-size: 0.9375rem;
}

.kanban {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.25rem;
}

@media (max-width: 48rem) {
  .kanban {
    grid-template-columns: 1fr;
  }
}

.kanban-columna {
  min-height: 14rem;
  padding: 0.85rem;
  border: 2.5px dashed var(--linea-suave);
  border-radius: var(--radio);
  transition:
    border-color 0.2s var(--ease),
    background 0.2s var(--ease);
}

.kanban-columna[data-destino] {
  border-color: var(--linea);
  background: color-mix(in srgb, var(--resaltador) 30%, transparent);
}

/* El título de cada columna es un sticker de color. */
.kanban-titulo {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin: 0 0 0.9rem;
  padding: 0.2rem 0.8rem;
  border: 2px solid var(--linea);
  border-radius: 999px;
  background: var(--resaltador);
  box-shadow: 2px 2px 0 var(--linea);
  font-family: var(--fuente-titulos);
  font-size: 1rem;
  font-weight: 800;
}

.kanban-columna:nth-child(2) .kanban-titulo {
  background: var(--cielo);
}

.kanban-columna:nth-child(3) .kanban-titulo {
  background: var(--menta);
}

.kanban-cantidad {
  font-family: var(--fuente-codigo);
  font-size: 0.8125rem;
  font-weight: 500;
}

.kanban-lista {
  display: grid;
  gap: 0.75rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.kanban-tarjeta {
  display: grid;
  gap: 0.5rem;
  padding: 0.8rem 0.9rem;
  border: 2px solid var(--linea);
  border-radius: var(--radio-chico);
  background: var(--superficie);
  box-shadow: var(--sombra-chica);
  cursor: pointer;
  transition:
    transform 0.15s var(--ease),
    box-shadow 0.15s var(--ease);
}

.kanban-tarjeta[draggable="true"] {
  cursor: grab;
}

.kanban-tarjeta:hover,
.kanban-tarjeta:focus-visible {
  transform: translate(-2px, -2px);
  box-shadow: var(--sombra);
}

.kanban-tarjeta:active {
  transform: rotate(-2deg);
}

/* Lo que el equipo ya resolvió: sticker menta. */
.kanban-tarjeta[data-hecha] {
