<style>

   preguntas como sección siempre abierta. Usa los tokens del visor; todo lo propio lleva el prefijo pp-. */

  max-width: 76rem; margin: 0 auto; display: grid; gap: 0.9rem;
  padding-block: 1rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pp-cabecera { display: grid; gap: 0.5rem; }
.pp-sobre { font-family: var(--fuente-codigo); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acento-texto); }
.pp-titulo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.5rem 1rem; }
.pp-titulo h1 { margin: 0; font-size: clamp(1.4rem, 3.4vw, 2rem); }
.pp-reloj { font-family: var(--fuente-codigo); font-weight: 700; border: var(--borde); border-radius: 999px; padding: 0.15rem 0.7rem; background: var(--superficie); font-variant-numeric: tabular-nums; }
.pp-fila { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; justify-content: space-between; }

.pp-charla[open] > div { position: absolute; right: 0; z-index: 5; width: min(36rem, 90vw); margin-top: 0.4rem; }
.pp-charla .markdown blockquote { margin: 0; }

.pp-body summary { cursor: pointer; list-style: none; }
.pp-body summary::-webkit-details-marker { display: none; }
.pp-body summary::before { content: "▸ "; }
.pp-body[open] summary::before { content: "▾ "; }
.pp-body summary::after { content: " (ver o editar)"; font-weight: 400; color: var(--texto-suave); }
.pp-body[open] summary::after { content: ""; }
.pp-cuerpo .pedido-respuesta pre { max-height: 9rem; overflow: auto; }

/* Secciones */
.pp-hilo { list-style: none; margin: 0; padding: 0 0 0.2rem; display: flex; gap: 0.4rem; overflow-x: auto; }
.pp-hilo li { flex: 1 0 8.5rem; }
.pp-hilo button { width: 100%; text-align: left; border: none; background: none; padding: 0.2rem 0.1rem; display: grid; gap: 0.3rem; font: inherit; color: var(--texto); cursor: pointer; }
.pp-hilo button:disabled { cursor: not-allowed; color: var(--texto-suave); }
.pp-barra { height: 7px; border-radius: 999px; background: var(--linea-suave); }
.pp-hilo .hecha .pp-barra { background: var(--texto); }
.pp-hilo .actual .pp-barra { background: var(--acento); }
.pp-hilo .siempre .pp-barra { height: 9px; border: 1.5px solid var(--linea); background: repeating-linear-gradient(90deg, var(--cielo) 0 10px, transparent 10px 14px); }
.pp-nombre { font-size: 0.82rem; font-weight: 600; line-height: 1.25; }

.pp-puntos i { width: 0.42rem; height: 0.42rem; border-radius: 50%; background: var(--linea-suave); }
.pp-puntos i.visto { background: var(--texto); }
.pp-puntos i.aca { background: var(--acento); }

/* Marco: una pantalla por vez */
.pp-marco {
  height: clamp(24rem, calc(100vh - 14.5rem), 48rem);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--superficie); border: var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); overflow: hidden;
}
.pp-marco-cabecera { padding: 0.75rem clamp(1rem, 3vw, 1.5rem); border-bottom: 2px solid var(--linea); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.4rem 1rem; }
.pp-marco-cabecera.de-preguntas { display: grid; justify-content: stretch; gap: 0.4rem; background: color-mix(in srgb, var(--cielo) 30%, var(--superficie)); }
.pp-marco-cabecera h2 { margin: 0; font-size: 1.2rem; }
.pp-cuerpo { padding: clamp(1rem, 3vw, 1.5rem); overflow: auto; animation: pp-entrar 0.3s var(--ease); }
.pp-cuerpo > .markdown:empty { display: none; }
/* Un poco más compacto que el visor, para que cada pantalla entre sin scroll. */
.pp-cuerpo { font-size: 0.95rem; }
.pp-cuerpo .markdown { line-height: 1.5; }
.pp-cuerpo .codigo pre { max-height: 11rem; overflow: auto; }
.pp-cuerpo .diagrama { margin-block: 0.5rem; }
.pp-cuerpo .anexo-en-linea { margin-block: 0.8rem; }
.pp-bajada { margin: 0 0 1rem; color: var(--texto-suave); max-width: 62ch; }
@keyframes pp-entrar { from { opacity: 0; transform: translateX(10px); } }
.pp-pie { padding: 0.65rem clamp(1rem, 3vw, 1.5rem); border-top: 2px solid var(--linea); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem; align-items: center; }
.pp-enlace { border: none; background: none; padding: 0; font: inherit; font-weight: 700; color: var(--acento-texto); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pp-maqueta { font-size: 0.75rem; font-style: italic; color: var(--texto-suave); margin: 0.4rem 0 0; }
.pp-respuesta:empty { display: none; }

/* Preguntas: la única sección con scroll */
.pp-progreso { height: 8px; border: 1.5px solid var(--linea); border-radius: 999px; overflow: hidden; background: var(--superficie); }
.pp-progreso div { height: 100%; background: var(--menta); transition: width 0.3s var(--ease); }
.pp-parte { font-family: var(--fuente-codigo); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto-suave); margin: 1.1rem 0 0.4rem; }
.pp-parte:first-child { margin-top: 0; }
.pp-pregunta { display: grid; gap: 0.55rem; padding: 0.7rem 0 1rem; border-bottom: 1.5px dashed var(--linea-suave); }
.pp-pregunta-cabecera { display: grid; grid-template-columns: 1.8rem minmax(0, 1fr) auto; gap: 0.4rem; align-items: baseline; }
.pp-n { font-family: var(--fuente-codigo); font-weight: 700; }
.pp-pregunta-titulo { font-weight: 700; }
.pp-intro, .pp-pista { font-size: 0.86rem; color: var(--texto-suave); }
.pp-pista::before { content: "Pista: "; font-weight: 700; color: var(--acento-texto); }
.pp-avance { font-family: var(--fuente-codigo); font-size: 0.72rem; font-weight: 700; border: 2px solid var(--linea); border-radius: 999px; padding: 0 0.4rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pp-pregunta.completa .pp-avance { background: var(--menta); }
.pp-subs { display: grid; gap: 0.7rem; padding-left: 2.2rem; }
.pp-sub { display: grid; gap: 0.3rem; }
.pp-sub label { font-size: 0.9rem; line-height: 1.4; }
.pp-sub-n { font-family: var(--fuente-codigo); font-size: 0.72rem; font-weight: 700; color: var(--texto-suave); margin-right: 0.25rem; }
.pp-sub textarea { min-height: 3.4rem; }
.pp-sub.lista textarea { border-color: var(--menta); box-shadow: 0 0 0 2px var(--menta); }
.pp-opcional { font-size: 0.68rem; font-weight: 700; border: 1.5px dashed var(--linea); border-radius: 999px; padding: 0 0.35rem; margin-left: 0.35rem; vertical-align: 1px; }

@media (max-width: 600px) {
  .pp-marco { height: max(22rem, calc(100vh - 19rem)); }
  .pp-detalle, .pp-largo { display: none; }
  .pp-corto { display: inline; }
  .pp-subs { padding-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .pp-cuerpo { animation: none; } }
</style>

<main class="pp-pagina">
  <header class="pp-cabecera">
    <span class="pp-sobre">Propuesta · la consigna por etapas · contenido tomado de main</span>
    <div class="pp-titulo"><h1 id="titulo"></h1><span class="pp-reloj" id="reloj"></span></div>
    <div class="pp-fila">
      <div class="pp-segmentado" id="selector" role="group" aria-label="Ejercicio"></div>
      <details class="pp-charla"><summary>De qué bloques de la charla sale</summary><div id="charla"></div></details>
    </div>
  </header>
  <ol class="pp-hilo" id="hilo" aria-label="Secciones"></ol>
  <section class="pp-marco" id="marco" aria-live="polite"></section>
</main>

<script>
/*DATOS*/

/* ── Estado ── */
function leer(clave, defecto) { try { const v = localStorage.getItem(clave); return v === null ? defecto : JSON.parse(v); } catch { return defecto; } }
function guardar(clave, valor) { try { localStorage.setItem(clave, JSON.stringify(valor)); } catch {} }
const PREGUNTAS = 'preguntas';
const IDS = Object.keys(DATOS);
const estado = { ej: IDS[0], porEj: Object.fromEntries(IDS.map((id) => [id, { pos: 0, alcanzada: 0, ultima: 0, respuestas: {} }])) };
for (const [id, p] of Object.entries(leer('consigna-por-etapas', {}))) if (estado.porEj[id]) estado.porEj[id] = p;
const prog = () => estado.porEj[estado.ej];
const persistir = () => guardar('consigna-por-etapas', estado.porEj);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Todas las pantallas del ejercicio, en orden, con la etapa a la que pertenecen. */
function pantallas(ej) {
  return ej.etapas.flatMap((e, i) => e.pantallas.map((p, j) => ({ ...p, etapa: i, j, de: e.pantallas.length })));
}

function contar(ej) {
  const r = prog().respuestas;
  let total = 0, hechas = 0;
  ej.partes.forEach((pt) => pt.preguntas.forEach((q) => {
    if (q.opcional) return;
    q.subs.forEach((_, j) => { total++; if ((r[`${q.n}.${j}`] || '').trim()) hechas++; });
  }));
  return { total, hechas };
}

/* ── Render ── */
function renderHilo(ej, todas) {
  const p = prog();
  const items = ej.etapas.map((e, i) => {
    const suyas = todas.map((x, k) => ({ ...x, k })).filter((x) => x.etapa === i);
    const primera = suyas[0].k;
    const bloqueada = primera > p.alcanzada;
    const actual = p.pos !== PREGUNTAS && todas[p.pos].etapa === i;
    const clase = actual ? 'actual' : suyas.every((x) => x.k <= p.alcanzada) ? 'hecha' : '';
    const puntos = suyas.map((x) => `<i class="${x.k === p.pos ? 'aca' : x.k <= p.alcanzada ? 'visto' : ''}"></i>`).join('');
    return `<li class="${clase}"><button type="button" data-ir="${primera}" ${bloqueada ? 'disabled' : ''} ${actual ? 'aria-current="step"' : ''}><span class="pp-barra"></span><span class="pp-nombre">${bloqueada ? '🔒 ' : ''}${i + 1}. ${e.nombre}</span><span class="pp-puntos">${puntos}</span></button></li>`;
  });
  const { total, hechas } = contar(ej);
  items.push(`<li class="siempre ${p.pos === PREGUNTAS ? 'actual' : ''}"><button type="button" data-ir="${PREGUNTAS}"><span class="pp-barra"></span><span class="pp-nombre">✎ Preguntas · ${hechas}/${total}</span><span class="pp-puntos">siempre abierta</span></button></li>`);
  document.getElementById('hilo').innerHTML = items.join('');
}

function renderPantalla(ej, todas) {
  const p = prog();
  const x = todas[p.pos], ant = todas[p.pos - 1], sig = todas[p.pos + 1];
  const etapa = ej.etapas[x.etapa];
  const puntos = todas.filter((y) => y.etapa === x.etapa).map((y) => `<i class="${y.j === x.j ? 'aca' : 'visto'}"></i>`).join('');
  const largo = !sig ? 'Ir a las preguntas' : sig.etapa !== x.etapa ? `Siguiente etapa: ${ej.etapas[sig.etapa].nombre}` : `Siguiente: ${esc(sig.titulo)}`;
  const etiquetaSig = `<span class="pp-largo">${largo}</span><span class="pp-corto">${sig ? 'Siguiente' : 'Preguntas'}</span>`;
  return `
    <div class="pp-marco-cabecera"><span class="pp-sobre">Etapa ${x.etapa + 1} · ${etapa.nombre} · ${esc(x.titulo)}</span><span class="pp-puntos">${puntos}<span>${x.j + 1} de ${x.de}</span></span></div>
    <div class="pp-cuerpo">${x.html}</div>
    <div class="pp-pie">
      <div>${ant ? `<button type="button" class="pp-enlace" data-ir="${p.pos - 1}">← <span class="pp-largo">Anterior: ${esc(ant.titulo)}</span><span class="pp-corto">Anterior</span></button>` : ''}</div>
      <button type="button" class="boton" data-siguiente>${etiquetaSig} →</button>
    </div>`;
}

function renderPreguntas(ej) {
  const p = prog();
  const { total, hechas } = contar(ej);
  const lista = ej.partes.map((pt) => `<h3 class="pp-parte">${esc(pt.nombre)}</h3>` + pt.preguntas.map((q) => {
    const listas = q.subs.filter((_, j) => (p.respuestas[`${q.n}.${j}`] || '').trim()).length;
    const subs = q.subs.map((texto, j) => {
      const id = `resp-${estado.ej}-${q.n}-${j}`;
      const valor = p.respuestas[`${q.n}.${j}`] || '';
      return `<div class="pp-sub ${valor.trim() ? 'lista' : ''}"><label for="${id}"><span class="pp-sub-n">${q.n}.${j + 1}</span>${texto}</label><textarea id="${id}" class="editor-respuestas" data-respuesta="${q.n}.${j}" placeholder="${esc(ej.placeholder || 'Con evidencia del log')}">${esc(valor)}</textarea></div>`;
    }).join('');
    return `<div class="pp-pregunta ${listas === q.subs.length ? 'completa' : ''}" data-subs="${q.subs.length}">
      <div class="pp-pregunta-cabecera"><span class="pp-n">${q.n}.</span><span><span class="pp-pregunta-titulo">${q.titulo}</span>${q.opcional ? '<span class="pp-opcional">opcional</span>' : ''}${q.intro && q.subs.length > 1 ? `<div class="pp-intro">${q.intro}</div>` : ''}${q.pista ? `<div class="pp-pista">${q.pista.replace(/^Pista:\s*/, '')}</div>` : ''}</span><span class="pp-avance">${listas}/${q.subs.length}</span></div>
      <div class="pp-subs">${subs}</div>
    </div>`;
  }).join('')).join('');
  return `
    <div class="pp-marco-cabecera de-preguntas">
      <div class="pp-fila"><h2>Preguntas</h2><span class="pp-contador" style="font-size:.85rem;color:var(--texto-suave)">${hechas} de ${total} respondidas</span></div>
      <div class="pp-progreso"><div style="width:${(hechas / total) * 100}%"></div></div>
    </div>
    <div class="pp-cuerpo">${lista}</div>
    <div class="pp-pie">
      <div><button type="button" class="pp-enlace" data-ir="${p.ultima}">← Volver a la consigna</button></div>
      <button type="button" class="boton" data-guardar>Guardar respuestas</button>
    </div>`;
}

function render() {
  const ej = DATOS[estado.ej];
  const p = prog();
  const todas = pantallas(ej);
  if (p.pos !== PREGUNTAS && p.pos >= todas.length) p.pos = 0;
  document.getElementById('selector').innerHTML = IDS.map((id) => `<button type="button" data-ej="${id}" aria-pressed="${id === estado.ej}">Ejercicio ${DATOS[id].numero}</button>`).join('');
  document.getElementById('titulo').textContent = `Ejercicio ${ej.numero} · ${ej.titulo}`;
  document.getElementById('reloj').textContent = `${ej.minutos}:00`;
  document.getElementById('charla').innerHTML = ej.charla;
  renderHilo(ej, todas);
  document.getElementById('marco').innerHTML = p.pos === PREGUNTAS ? renderPreguntas(ej) : renderPantalla(ej, todas);
}

/* ── Navegación ── */
function ir(destino) {
  const p = prog();
  const total = pantallas(DATOS[estado.ej]).length;
  if (destino === PREGUNTAS || destino >= total) { if (p.pos !== PREGUNTAS) p.ultima = p.pos; p.pos = PREGUNTAS; }
  else if (destino >= 0 && destino <= p.alcanzada) p.pos = destino;
  persistir(); render();
}
function siguiente() {
  const p = prog();
  if (p.pos === PREGUNTAS) return;
  p.alcanzada = Math.max(p.alcanzada, p.pos + 1);
  ir(p.pos + 1);
}

async function copiar(boton, texto, etiqueta) {
  try { await navigator.clipboard.writeText(texto); boton.textContent = '¡Copiado!'; }
  catch { boton.textContent = 'No se pudo copiar'; }
  setTimeout(() => { boton.textContent = etiqueta; }, 2000);
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.ej) { estado.ej = b.dataset.ej; render(); }
  else if (b.dataset.siguiente !== undefined) siguiente();
  else if (b.dataset.ir !== undefined) ir(b.dataset.ir === PREGUNTAS ? PREGUNTAS : Number(b.dataset.ir));
  else if (b.dataset.copiar !== undefined) copiar(b, b.nextElementSibling?.textContent ?? '', b.textContent);
  else if (b.dataset.simular) {
    // Respuesta simulada: el visor real manda el pedido a la API.
    const r = JSON.parse(b.dataset.simular);
    b.closest('.pedido').querySelector('.pp-respuesta').innerHTML = `<div class="pedido-respuesta" role="status"><span class="pedido-estado" data-ok="${r.estado < 400}">${r.estado}</span><pre>${esc(JSON.stringify(r.cuerpo, null, 2))}</pre></div>`;
  }
  else if (b.dataset.guardar !== undefined) { persistir(); b.textContent = 'Guardado'; setTimeout(() => { b.textContent = 'Guardar respuestas'; }, 1500); }
});

// Flechas del teclado para pasar de pantalla, salvo mientras se escribe.
document.addEventListener('keydown', (e) => {
  if (e.target.closest('textarea, input') || e.altKey || e.metaKey || e.ctrlKey) return;
  const p = prog();
  if (e.key === 'ArrowRight') siguiente();
  else if (e.key === 'ArrowLeft' && p.pos !== PREGUNTAS && p.pos > 0) ir(p.pos - 1);
});

// Las respuestas se guardan al escribir; se actualizan los contadores sin redibujar los recuadros.
document.addEventListener('input', (e) => {
  const clave = e.target.dataset && e.target.dataset.respuesta;
  if (!clave) return;
  prog().respuestas[clave] = e.target.value;
  persistir();
  const ej = DATOS[estado.ej];
  const { total, hechas } = contar(ej);
  e.target.closest('.pp-sub').classList.toggle('lista', !!e.target.value.trim());
  const fila = e.target.closest('.pp-pregunta');
  const listas = fila.querySelectorAll('.pp-sub.lista').length;
  fila.querySelector('.pp-avance').textContent = `${listas}/${fila.dataset.subs}`;
  fila.classList.toggle('completa', listas === Number(fila.dataset.subs));
  document.querySelector('.pp-contador').textContent = `${hechas} de ${total} respondidas`;
  document.querySelector('.pp-progreso div').style.width = `${(hechas / total) * 100}%`;
  renderHilo(ej, pantallas(ej));
});

render();
</script>
</html>
